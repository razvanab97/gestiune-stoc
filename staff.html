<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Împachetare comenzi - AB HOMES</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Roboto+Mono:wght@400;500;600;700&display=swap');
:root{
  --bg:#F6F7FB;--surf:#FFFFFF;--surf2:#F8F9FC;
  --b1:#E5E7EB;--b2:#E5E7EB;--b3:#D0D5DD;
  --t1:#17181C;--t2:#3F4451;--t3:#667085;
  --acc:#7657F6;--acc2:#6342E8;--acc-fg:#FFFFFF;--acc-light:#F3F0FF;
  --gr:#12B76A;--gr-bg:#ECFDF3;
  --rd:#F04438;--rd-bg:#FEF3F2;
  --or:#F79009;--or-bg:#FFFAEB;
  --r:10px;--r2:14px;--r3:18px;
  --font:'DM Sans',sans-serif;--mono:'Roboto Mono',monospace;
  --sh2:0 8px 24px rgba(16,24,40,.10);
  /* liquid glass — suprafețe translucide + blur, cu un fundal degrade colorat dedesubt ca să aibă ce reflecta */
  --glass:rgba(255,255,255,.58);--glass-strong:rgba(255,255,255,.8);
  --glass-bd:rgba(255,255,255,.7);--glass-blur:blur(22px) saturate(180%);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);color:var(--t1);font-size:22px;font-weight:500;line-height:1.4;min-height:100vh;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none;
  background:
    radial-gradient(1100px 750px at 12% -8%,rgba(118,87,246,.20),transparent 60%),
    radial-gradient(950px 700px at 105% 5%,rgba(18,183,106,.12),transparent 55%),
    radial-gradient(900px 850px at 45% 115%,rgba(247,144,9,.10),transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button{font-family:var(--font);cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px 110px;display:flex;flex-direction:column;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.hdr h1{font-size:26px;font-weight:700}
.sync-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.sync-dot.ok{background:var(--gr)}
.sync-dot.err{background:var(--rd)}
.progress-txt{font-size:18px;color:var(--t3);font-weight:600}
.progress-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-bar{flex:1;height:10px;border-radius:999px;background:var(--b1);overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:999px;transition:width .3s}
.progress-pct{font-family:var(--mono);font-size:16px;color:var(--t3);font-weight:700;flex-shrink:0}

/* NAV — 5 secțiuni, simplu, touch-friendly */
.tabbar{display:flex;gap:8px;margin-bottom:18px;background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);box-shadow:var(--sh2);border-radius:var(--r2);padding:6px;overflow-x:auto}
.tab-btn{flex:1;min-width:84px;padding:12px 6px;border-radius:var(--r);border:none;background:transparent;color:var(--t3);font-size:15px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.tab-btn .ic{font-size:22px}
.tab-btn.on{background:var(--acc-light);color:var(--acc)}
.tab-badge{background:var(--rd);color:#fff;font-size:12px;font-weight:800;border-radius:999px;padding:0 6px;min-width:16px;display:inline-block;margin-left:2px}

.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-row input{flex:1;font-size:20px;padding:14px 16px;border:1px solid var(--b2);border-radius:var(--r2);background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.search-row input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-light)}
.search-drop{position:relative}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r2);box-shadow:var(--sh2);max-height:320px;overflow-y:auto;z-index:20;display:none}
.search-results.on{display:block}
.search-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--b1);font-size:18px}
.search-item:last-child{border-bottom:none}
.search-item:active{background:var(--surf2)}
.search-item b{color:var(--acc)}
.search-page-list{display:flex;flex-direction:column;gap:10px}

.empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--t3);text-align:center;padding:40px 20px}
.empty .big{font-size:60px}

.card{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r3);box-shadow:0 8px 32px rgba(16,24,40,.14),inset 0 1px 0 rgba(255,255,255,.5);padding:28px;flex:1;display:flex;flex-direction:column;gap:20px}
.card.finalized{border-color:rgba(18,183,106,.4);background:linear-gradient(180deg,rgba(236,253,243,.75),var(--glass) 140px)}
.card.waiting{border-color:rgba(247,144,9,.45)}
.ord-hdr{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--b1)}
.ord-hdr-row1{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ord-pl{font-weight:700;padding:4px 12px;border-radius:999px;font-size:16px}
.ord-pl.emag{background:var(--acc-light);color:var(--acc)}
.ord-pl.trendyol{background:var(--or-bg);color:var(--or)}
.ord-pl.direct{background:var(--surf2);color:var(--t2)}
.ord-num{font-family:var(--mono);font-weight:700;font-size:34px}
.ord-client{font-weight:700;font-size:34px;color:var(--t1)}
.ord-date{color:var(--t3);font-size:16px;margin-left:auto}
.ord-finalized-badge{background:var(--gr-bg);color:var(--gr);font-weight:700;padding:4px 12px;border-radius:999px;font-size:15px}
.ord-waiting-badge{background:var(--or-bg);color:var(--or);font-weight:700;padding:4px 12px;border-radius:999px;font-size:15px}
/* Prezență/blocare moale (Faza 2) — doar avertisment, angajatul poate continua oricând, decizie
   confirmată direct. Nu e o măsură de securitate (nume din localStorage, peste cheia anon expusă). */
.lock-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--or-bg);color:#92400e;border-radius:var(--r2);font-size:16px;font-weight:600}
.staff-name-badge{background:none;border:1px solid var(--b2);color:var(--t2);font-size:15px;font-weight:700;padding:6px 12px;border-radius:999px;flex-shrink:0}
.staff-name-badge:active{background:var(--surf2)}

.awb-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;background:linear-gradient(135deg,rgba(243,240,255,.75),rgba(255,255,255,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(118,87,246,.25);border-radius:var(--r2)}
.awb-lbl{font-size:14px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.awb-num{font-family:var(--mono);font-weight:800;font-size:28px;color:var(--t1);word-break:break-all}
.awb-pending{color:var(--t3);font-size:16px;font-weight:600}

.progress-mini{font-size:16px;color:var(--t3);font-weight:700}

.lines{display:flex;flex-direction:column;gap:20px}
.line{display:flex;gap:22px;padding:22px;border:1px solid var(--glass-bd);border-radius:var(--r2);flex-wrap:wrap;position:relative;background:rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.line.done{border-color:rgba(18,183,106,.4);background:rgba(236,253,243,.55)}
.line.blocked{border-color:rgba(240,68,56,.4);background:rgba(254,243,242,.55)}
.line-img-wrap{flex-shrink:0;width:172px}
.line-img{width:172px;height:172px;border-radius:var(--r);object-fit:cover;border:1px solid var(--b1);background:var(--surf2);cursor:pointer}
.line-img-ph{width:172px;height:172px;border-radius:var(--r);background:var(--surf2);border:1px dashed var(--b2);display:flex;align-items:center;justify-content:center;font-size:60px}
.line-thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.line-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:.6}
.line-thumb.active{border-color:var(--acc);opacity:1}
.line-info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.line-nm{font-weight:700;font-size:26px}
.line-meta{color:var(--t3);font-size:18px}
.line-qty-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:4px}
.line-qty-box{margin-top:2px}
.line-stock-box{margin-top:2px;margin-left:auto;text-align:right}
.line-qty-lbl{font-size:14px;color:var(--t3);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.line-qty{font-family:var(--mono);font-weight:800;font-size:36px;color:var(--acc);line-height:1.15}
.line-stock{font-family:var(--mono);font-weight:700;font-size:19px;color:var(--t3);line-height:1.3}
.line-stock.low{color:var(--or)}
.line-stock.zero{color:var(--rd)}
.line-issue{margin-top:4px;font-size:16px;color:var(--rd);font-weight:700}
.line-check{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:2px solid var(--b2);background:var(--surf);font-size:17px;font-weight:700;color:var(--t2);margin-top:6px}
.line-check.on{background:var(--gr);border-color:var(--gr);color:#fff}

.big-pack-btn{width:100%;padding:26px 16px;border-radius:var(--r3);border:none;background:var(--acc);color:#fff;font-size:26px;font-weight:800;box-shadow:0 10px 26px rgba(118,87,246,.35),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:.02em;min-height:80px}
.big-pack-btn:active{background:var(--acc2)}
.big-pack-btn:disabled{background:var(--b2);color:var(--t3);box-shadow:none;cursor:default}
.big-pack-btn.done{background:var(--gr);box-shadow:0 10px 26px rgba(18,183,106,.3),inset 0 1px 0 rgba(255,255,255,.35);font-size:21px}
.big-pack-btn.done:active{background:#0e9c5c}

.nav-row{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.nav-btn{flex:1;padding:20px;border-radius:var(--r2);border:1px solid var(--glass-bd);background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:20px;font-weight:700;color:var(--t1);min-height:72px}
.nav-btn:disabled{opacity:.4}
.report-btn{flex:0 0 auto;padding:0 18px;border-radius:var(--r2);border:1px solid var(--glass-bd);background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:15px;font-weight:700;color:var(--t2);min-height:72px;white-space:nowrap}
.report-btn:active{background:var(--surf2)}

/* liste (În așteptare / Finalizate / Căutare) */
.list-item{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r2);cursor:pointer}
.list-item:active{background:rgba(255,255,255,.4)}
.list-item-th{width:56px;height:56px;border-radius:var(--r);object-fit:cover;flex-shrink:0;background:var(--surf2);border:1px solid var(--b1)}
.list-item-th-ph{width:56px;height:56px;border-radius:var(--r);flex-shrink:0;background:var(--surf2);border:1px dashed var(--b2);display:flex;align-items:center;justify-content:center;font-size:26px}
.list-item-main{flex:1;min-width:0}
.list-item-nm{font-weight:700;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item-meta{color:var(--t3);font-size:15px;margin-top:2px}
.list-item-issue{color:var(--rd);font-size:15px;font-weight:700;margin-top:2px}
.list-item-time{color:var(--t3);font-size:14px;flex-shrink:0}

/* Legendă */
.legend-sec{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r2);padding:18px 20px;margin-bottom:14px}
.legend-sec h3{font-size:19px;margin-bottom:8px;color:var(--t1)}
.legend-row{display:flex;gap:10px;padding:6px 0;font-size:17px;color:var(--t2);border-bottom:1px solid var(--b1)}
.legend-row:last-child{border-bottom:none}
.legend-row b{color:var(--t1);flex-shrink:0;min-width:150px}

/* bottom sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-overlay.on{display:flex}
.sheet{background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-top:1px solid var(--glass-bd);border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;padding:20px 20px 28px;box-shadow:0 -8px 30px rgba(16,24,40,.2)}
.sheet-title{font-size:22px;font-weight:800;margin-bottom:4px}
.sheet-sub{font-size:17px;color:var(--t3);margin-bottom:16px}
.sheet-opt{width:100%;text-align:left;padding:18px 18px;border-radius:var(--r2);border:1px solid var(--b1);background:var(--surf2);font-size:19px;font-weight:700;color:var(--t1);margin-bottom:10px;min-height:64px}
.sheet-opt:active{background:var(--b1)}
.sheet-opt.danger{color:var(--rd)}
.sheet-opt.soft{color:var(--or)}
.sheet-qty-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sheet-qty-btn{flex:1;min-width:70px;padding:16px 8px;border-radius:var(--r2);border:2px solid var(--b2);background:var(--surf);font-size:19px;font-weight:800;color:var(--t2)}
.sheet-qty-btn:active{background:var(--acc-light);border-color:var(--acc)}
.sheet-close{width:100%;padding:16px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--surf);font-size:18px;font-weight:700;color:var(--t2)}
.sheet-note{width:100%;padding:12px 14px;border:1px solid var(--b2);border-radius:var(--r2);font-size:17px;font-family:var(--font);margin-bottom:14px;resize:vertical;min-height:70px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(23,24,28,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;padding:12px 18px;border-radius:999px;font-size:18px;font-weight:600;box-shadow:var(--sh2);z-index:300;opacity:0;transition:opacity .2s;pointer-events:none;display:flex;align-items:center;gap:12px;max-width:92vw}
.toast.on{opacity:1;pointer-events:auto}
.toast-undo{background:rgba(255,255,255,.15);border:none;color:#fff;font-weight:800;padding:6px 14px;border-radius:999px;flex-shrink:0}
.toast-undo:active{background:rgba(255,255,255,.28)}

@media(max-width:600px){
  .line{flex-direction:column;align-items:center;text-align:center}
  .line-img-wrap{width:100%;display:flex;justify-content:center}
  .line-info{align-items:center}
  .legend-row{flex-direction:column;gap:2px}
  .legend-row b{min-width:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>📦 Împachetare comenzi</h1>
    <div style="display:flex;align-items:center;gap:10px">
      <button type="button" class="staff-name-badge" id="staff-name-badge" onclick="editStaffName()"></button>
      <span class="sync-dot" id="sync-dot"></span>
    </div>
  </div>
  <div class="progress-txt" id="progress-txt">Se încarcă…</div>
  <div class="progress-bar-wrap">
    <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
    <span class="progress-pct" id="progress-pct"></span>
  </div>

  <div class="tabbar">
    <button class="tab-btn on" data-tab="pack" onclick="setTab('pack')"><span class="ic">📦</span>Împachetare</button>
    <button class="tab-btn" data-tab="waiting" onclick="setTab('waiting')"><span class="ic">⏸</span>În așteptare<span class="tab-badge" id="waiting-badge" style="display:none"></span></button>
    <button class="tab-btn" data-tab="finalized" onclick="setTab('finalized')"><span class="ic">✓</span>Finalizate azi</button>
    <button class="tab-btn" data-tab="search" onclick="setTab('search')"><span class="ic">🔍</span>Căutare</button>
    <button class="tab-btn" data-tab="legend" onclick="setTab('legend')"><span class="ic">ⓘ</span>Legendă</button>
  </div>

  <div id="main-area"></div>
</div>

<div class="sheet-overlay" id="sheet-overlay" onclick="if(event.target===this)closeSheet()">
  <div class="sheet" id="sheet-body"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPA_URL='https://nuvgwytanlgvcffxeahs.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51dmd3eXRhbmxndmNmZnhlYWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDI0OTAsImV4cCI6MjA5NTI3ODQ5MH0.lSy1CUJA9xlVv1isAyfTIxGUAbGMUIS7c3TXQ-5pcEg';
async function sb(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,opts);
  const d=await r.json();
  if(!r.ok)throw new Error(JSON.stringify(d));
  return d;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imgSrc(url){if(!url)return'';if(url.startsWith('data:'))return url;if(url.startsWith(SUPA_URL))return url;if(url.startsWith('http'))return'/api/img-proxy?url='+encodeURIComponent(url);return url;}
function td(){return new Date().toISOString().slice(0,10);}

// Doar comenzile/vânzările de la această dată încolo intră în coadă — comenzile mai vechi decât
// lansarea paginii de Staff rămân în istoric (index.html), dar nu mai apar aici (cerință directă:
// "de azi trebuie sa inceapa"). NU se recalculează automat la fiecare zi — e un prag fix.
const CUTOFF_DATE='2026-08-27';
const ISSUE_LABELS={stoc_zero:'Stoc zero',cantitate_insuficienta:'Cantitate insuficientă',produs_deteriorat:'Produs deteriorat',produs_gresit:'Produs greșit',nu_gasesc:'Nu găsesc produsul',alta:'Altă problemă'};

let PRODUSE=[],COMENZI=[],JURNAL=[],ORDERS=[],curKey=null,activeTab='pack',activeImg={};
let sheetCtx=null; // {lk} sau {lk,type:'stoc_redus'} — comanda/linia pentru care e deschis sheet-ul de probleme
let pendingUndo=null; // {orderKey,lines:[{table,id,prev}],timeoutId,type}
let lineBusy={}; // lk -> true cât timp o cerere e în curs (protecție dublu-tap)
let pollTimer=null;
// Identitate — DOAR un semnal, nu o măsură de securitate (nume din localStorage, peste cheia anon
// expusă, la fel ca restul aplicației, documentat intenționat). Consecvent cu filozofia "fără PIN"
// originală a paginii Staff — nu adăugăm autentificare reală, doar atribuire pentru prezență/audit.
const STAFF_NAME_KEY='sm6_staff_name';
let staffName='';
try{staffName=localStorage.getItem(STAFF_NAME_KEY)||'';}catch(e){}
const LOCK_TTL_MIN=15;
let lockHeartbeatTimer=null,lockHeartbeatKey=null;

function findProdus(id){return id?PRODUSE.find(p=>p.id===id):null;}

function computeOrders(){
  const groups={};
  COMENZI.forEach(o=>{
    const key=o.comanda_id||('_row'+o.id);
    if(!groups[key])groups[key]={key,comandaId:o.comanda_id||'',platforma:o.platforma,clientNume:o.client_nume||'',data:o.data,sortAt:o.created_at||o.data,lines:[]};
    o._table='platforma_comenzi';
    groups[key].lines.push(o);
    if(String(o.created_at||o.data)<String(groups[key].sortAt))groups[key].sortAt=o.created_at||o.data;
  });

  // Comenzile eMAG/Trendyol se scriu automat și în Jurnal la import (ca să existe evidența zilnică
  // corectă acolo) — ca să nu apară de 2 ori în coadă, scădem din fiecare rând de Jurnal cantitatea
  // deja acoperită de o comandă de platformă pentru același produs, în aceeași zi. Ce rămâne peste
  // (dacă rămâne) chiar a fost o vânzare directă ("Extra").
  const coveredByPlatform={};
  COMENZI.forEach(o=>{
    const day=String(o.created_at||o.data).slice(0,10);
    const k=o.produs_id+'|'+day;
    coveredByPlatform[k]=(coveredByPlatform[k]||0)+(Number(o.cantitate)||0);
  });
  JURNAL.forEach(j=>{
    const day=String(j.data).slice(0,10);
    const k=j.product_id+'|'+day;
    const remaining=(Number(j.qty)||0)-(coveredByPlatform[k]||0);
    if(remaining<=0)return;
    const line={id:j.id,produs_id:j.product_id,produs_nume:j.product_name,cantitate:remaining,pnk:'',awb:'',
      impachetat:!!j.impachetat,impachetat_at:j.impachetat_at||'',fara_stoc:!!j.fara_stoc,
      staff_blocked:!!j.staff_blocked,staff_blocked_at:j.staff_blocked_at||'',staff_issue_type:j.staff_issue_type||'',
      staff_issue_note:j.staff_issue_note||'',staff_issue_resolved:!!j.staff_issue_resolved,_table:'jurnal'};
    groups['j'+j.id]={key:'j'+j.id,comandaId:'',platforma:'direct',clientNume:'',data:j.data,sortAt:j.created_at||j.data,lines:[line]};
  });

  ORDERS=Object.values(groups).sort((a,b)=>String(a.sortAt).localeCompare(String(b.sortAt))||a.key.localeCompare(b.key));
  ORDERS.forEach(g=>{
    g.allDone=g.lines.every(l=>l.impachetat||l.staff_blocked);
    g.hasUnresolvedIssue=g.lines.some(l=>l.staff_blocked&&!l.staff_issue_resolved);
    g.finalized=g.allDone&&!g.hasUnresolvedIssue;
    g.waiting=g.hasUnresolvedIssue;
    g.awb=(g.lines.find(l=>l.awb)||{}).awb||'';
    const lastPackedAt=g.lines.map(l=>l.impachetat_at).filter(Boolean).sort().slice(-1)[0]||'';
    g.finalizedToday=g.finalized&&lastPackedAt.slice(0,10)===td();
  });
}
function packQueue(){return ORDERS.filter(o=>!o.finalized&&!o.waiting);}
function waitingQueue(){return ORDERS.filter(o=>o.waiting);}
// listă completă (inclusiv comenzi deja împachetate) pt. navigare Anterioară/Următoare —
// packQueue() se golește pe măsură ce lucrezi, așa că butonul "Anterioară" ar rămâne mereu
// dezactivat dacă ar naviga tot peste packQueue (nu mai există "înainte" în coada care se micșorează)
function navQueue(){return ORDERS.filter(o=>!o.waiting);}
function finalizedTodayQueue(){return ORDERS.filter(o=>o.finalizedToday).sort((a,b)=>{
  const at=a=>a.lines.map(l=>l.impachetat_at).filter(Boolean).sort().slice(-1)[0]||'';
  return at(b).localeCompare(at(a));
});}
function currentOrder(){return ORDERS.find(o=>o.key===curKey)||null;}

function pickInitialOrder(list){curKey=list.length?list[0].key:null;}

function showToast(msg,undoFn){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+(undoFn?'<button class="toast-undo" id="toast-undo-btn">ANULEAZĂ · <span id="toast-undo-sec">5</span>s</button>':'');
  t.classList.add('on');
  if(undoFn)document.getElementById('toast-undo-btn').onclick=()=>{undoFn();hideToast();};
  clearTimeout(showToast._t);
  if(!undoFn)showToast._t=setTimeout(hideToast,1800);
}
function hideToast(){document.getElementById('toast').classList.remove('on');}

// Bara de progres arată doar ziua CEA MAI RECENTĂ prezentă în date (nu tot intervalul de la
// CUTOFF_DATE) — cerere directă: numărul total nu trebuie să crească la nesfârșit pe măsură ce trec
// zilele, ci să „se reseteze" de fiecare dată când intră un lot nou de comenzi, arătând doar câte sunt
// de lucru în ziua respectivă. Coada reală de împachetat (packQueue/waitingQueue) rămâne neschimbată —
// o comandă mai veche, încă neîmpachetată, tot apare acolo, doar bara de sus nu o mai numără la infinit.
function progressDay(){
  if(!ORDERS.length)return null;
  return ORDERS.reduce((max,o)=>o.data>max?o.data:max,ORDERS[0].data);
}
function renderProgress(){
  const day=progressDay();
  const dayOrders=day?ORDERS.filter(o=>o.data===day):[];
  const total=dayOrders.length;
  const done=dayOrders.filter(o=>o.finalized).length;
  const remaining=total-done;
  document.getElementById('progress-txt').textContent=total?`${remaining} comenzi rămase din ${total}`:'Nicio comandă încă';
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-pct').textContent=`${done} / ${total} (${pct}%)`;
  const wc=waitingQueue().length;
  const badge=document.getElementById('waiting-badge');
  if(wc){badge.style.display='inline-block';badge.textContent=wc;}else{badge.style.display='none';}
}

function setTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='pack'){const q=packQueue();if(!q.some(o=>o.key===curKey))pickInitialOrder(q);}
  if(tab==='waiting'){const q=waitingQueue();if(!q.some(o=>o.key===curKey))pickInitialOrder(q);}
  renderMain();
}

function lineKey(l){return l._table+'_'+l.id;}
function findLineByKey(lk){return ORDERS.flatMap(o=>o.lines).find(l=>lineKey(l)===lk)||null;}
function orderOfLine(l){return ORDERS.find(o=>o.lines.includes(l));}

function lineImgList(l){
  const p=findProdus(l.produs_id);
  if(!p)return[];
  const list=[];
  if(p.img)list.push(p.img);
  (p.images||[]).forEach(u=>{if(u&&!list.includes(u))list.push(u);});
  return list;
}

let lastLockedKey=undefined; // undefined != null, ca primul render (curKey posibil null) să nu fie ignorat
function renderMain(){
  renderProgress();
  if(curKey!==lastLockedKey){
    lastLockedKey=curKey;
    if(curKey)claimOrderLock(curKey);else stopLockHeartbeat();
  }
  const host=document.getElementById('main-area');
  if(activeTab==='pack')return renderPackTab(host);
  if(activeTab==='waiting')return renderWaitingTab(host);
  if(activeTab==='finalized')return renderFinalizedTab(host);
  if(activeTab==='search')return renderSearchTab(host);
  if(activeTab==='legend')return renderLegendTab(host);
}

function lineThumbHtml(l){
  const imgs=lineImgList(l);
  const lk=lineKey(l);
  const activeUrl=activeImg[lk]||imgs[0]||'';
  const imgHtml=activeUrl
    ?`<img class="line-img" src="${esc(imgSrc(activeUrl))}" onerror="this.style.display='none'" onclick="cycleLineImg('${lk}')">`
    :`<div class="line-img-ph">📦</div>`;
  const thumbsHtml=imgs.length>1?`<div class="line-thumbs">${imgs.map(u=>`<img class="line-thumb ${u===activeUrl?'active':''}" src="${esc(imgSrc(u))}" onclick="activeImg['${lk}']='${esc(u)}';renderMain()">`).join('')}</div>`:'';
  return`<div class="line-img-wrap">${imgHtml}${thumbsHtml}</div>`;
}

function lineInfoHtml(l,showCheck){
  const p=findProdus(l.produs_id);
  const lk=lineKey(l);
  const issueHtml=l.staff_blocked?`<div class="line-issue">⛔ ${esc(ISSUE_LABELS[l.staff_issue_type]||'Problemă raportată')}</div>`:'';
  const checkHtml=showCheck?`<button type="button" class="line-check ${l.impachetat?'on':''}" ${lineBusy[lk]?'disabled':''} onclick="toggleLineCheck('${lk}')">${l.impachetat?'✓ Confirmat':'Confirmă produs'}</button>`:'';
  const stock=p?(Number(p.bought)||0)-(Number(p.sold)||0):null;
  const stockCls=stock===null?'':stock<=0?'zero':stock<Number(l.cantitate)?'low':'';
  const stockHtml=stock===null?'':`<div class="line-stock-box"><div class="line-qty-lbl">Stoc ERP</div><div class="line-stock ${stockCls}">${stock} BUC.</div></div>`;
  return`<div class="line-info">
    <div class="line-nm">${esc(l.produs_nume||l.titlu_extern||'Produs necunoscut')}</div>
    <div class="line-meta">${p&&p.internalCode?'Cod intern '+esc(p.internalCode)+' · ':''}${p&&p.sku?'SKU '+esc(p.sku):''}</div>
    <div class="line-qty-row">
      <div class="line-qty-box"><div class="line-qty-lbl">Cantitate în comandă</div><div class="line-qty">${l.cantitate} BUC.</div></div>
      ${stockHtml}
    </div>
    ${issueHtml}${checkHtml}
  </div>`;
}

function renderPackTab(host){
  const q=packQueue();
  if(!q.length){
    host.innerHTML=`<div class="empty"><div class="big">🎉</div><div>Nicio comandă de împachetat momentan.</div></div>`;
    return;
  }
  const nq=navQueue();
  if(!currentOrder()||!nq.some(o=>o.key===curKey)){curKey=q[0].key;}
  const ord=currentOrder();
  const idx=nq.findIndex(o=>o.key===ord.key);
  const plLabel=ord.platforma==='emag'?'eMAG':ord.platforma==='trendyol'?'Trendyol':'Extra';
  const multi=ord.lines.length>1;
  const doneCount=ord.lines.filter(l=>l.impachetat).length;
  const linesHtml=ord.lines.map(l=>{
    const state=l.impachetat?'done':(l.staff_blocked?'blocked':'');
    return`<div class="line ${state}">${lineThumbHtml(l)}${lineInfoHtml(l,multi)}</div>`;
  }).join('');
  const allChecked=ord.lines.every(l=>l.impachetat||l.staff_blocked);
  const singleLine=!multi?ord.lines[0]:null;
  const singleLk=singleLine?lineKey(singleLine):null;
  const bigBtnHtml=multi
    ?`<button type="button" class="big-pack-btn" ${allChecked&&!lineBusy['order_'+ord.key]?'':'disabled'} onclick="finalizeOrder('${ord.key}')">✓ ÎMPACHETAT${!allChecked?` (${doneCount}/${ord.lines.length})`:''}</button>`
    :singleLine.impachetat
      ?`<button type="button" class="big-pack-btn done" ${lineBusy[singleLk]?'disabled':''} onpointerdown="startHoldUnpack('${singleLk}')" onpointerup="cancelHoldUnpack()" onpointerleave="cancelHoldUnpack()" onpointercancel="cancelHoldUnpack()">✓ ÎMPACHETAT · ține apăsat pentru anulare</button>`
      :`<button type="button" class="big-pack-btn" ${lineBusy[singleLk]?'disabled':''} onclick="packSingleLine('${singleLk}','${ord.key}')">✓ ÎMPACHETAT</button>`;
  host.innerHTML=`<div class="card">
    <div class="ord-hdr">
      <div class="ord-hdr-row1">
        <span class="ord-pl ${ord.platforma}">${plLabel}</span>
        ${ord.comandaId?`<span class="ord-num">#${esc(ord.comandaId)}</span>`:''}
        <span class="ord-date">${esc(ord.data||'')}</span>
      </div>
      ${ord.clientNume?`<div class="ord-client">${esc(ord.clientNume)}</div>`:''}
    </div>
    <div id="lock-banner-slot"></div>
    ${ord.awb?`<div class="awb-box"><div><div class="awb-lbl">AWB</div><div class="awb-num">${esc(ord.awb)}</div></div></div>`:(ord.platforma!=='direct'?`<div class="awb-box"><span class="awb-pending">AWB în așteptare</span></div>`:'')}
    ${multi?`<div class="progress-mini">${doneCount} / ${ord.lines.length} produse pregătite</div>`:''}
    <div class="lines">${linesHtml}</div>
    ${bigBtnHtml}
    <div class="nav-row">
      <button class="nav-btn" onclick="navStep(-1)" ${idx<=0?'disabled':''}>◀ Anterioară</button>
      <button type="button" class="report-btn" onclick="openReportSheet('${ord.key}')">⚠ Raportează problemă</button>
      <button class="nav-btn" onclick="navStep(1)" ${idx<0||idx>=nq.length-1?'disabled':''}>Următoare ▶</button>
    </div>
    <div style="text-align:center;color:var(--t3);font-size:15px">Comanda ${idx+1} din ${nq.length}</div>
  </div>`;
}

function navStep(dir){
  const q=navQueue();
  const idx=q.findIndex(o=>o.key===curKey);
  const ni=idx+dir;
  if(ni<0||ni>=q.length)return;
  curKey=q[ni].key;
  renderMain();
}

function cycleLineImg(lk){
  const imgs=lineImgList(findLineByKey(lk)||{});
  if(imgs.length<2)return;
  const cur=activeImg[lk]||imgs[0];
  const idx=(imgs.indexOf(cur)+1)%imgs.length;
  activeImg[lk]=imgs[idx];
  renderMain();
}

async function logActivity(action,line,detail){
  try{
    await sb('POST','staff_activity_log',{staff_name:staffName||null,action,entity_table:line?line._table:null,entity_id:line?line.id:null,comanda_id:line?(orderOfLine(line)?.comandaId||null):null,detail:detail||null});
  }catch(e){console.warn('activity log:',e);}
}

/* ── Identitate + blocare/prezență (Faza 2) ── */
function renderStaffNameBadge(){
  const el=document.getElementById('staff-name-badge');if(!el)return;
  el.textContent=staffName?('👤 '+staffName):'👤 Cine ești?';
}
function editStaffName(){
  const v=prompt('Numele tău (apare pe comenzile la care lucrezi, doar informativ):',staffName);
  if(v===null)return;
  staffName=v.trim();
  try{localStorage.setItem(STAFF_NAME_KEY,staffName);}catch(e){}
  renderStaffNameBadge();
}
function showLockBanner(name,ageMin){
  const el=document.getElementById('lock-banner-slot');if(!el)return;
  const ago=ageMin<1?'chiar acum':`acum ${Math.round(ageMin)} min`;
  el.innerHTML=`<div class="lock-banner">👀 <b>${esc(name)}</b> lucrează la asta (${esc(ago)}) — poți continua oricând</div>`;
}
function hideLockBanner(){
  const el=document.getElementById('lock-banner-slot');if(el)el.innerHTML='';
}
function orderLockTarget(ord){
  // O comandă de platformă = mai multe rânduri (comanda_id+platforma) — blocarea trebuie scrisă/citită
  // pe TOATE deodată (un singur PATCH), nu per linie, altfel două tablete pot "despărți" lock-ul pe o
  // comandă cu produse multiple. Comenzile directe (jurnal) sunt deja un singur rând.
  const l=ord.lines[0];
  if(l._table==='platforma_comenzi'&&ord.comandaId)return{table:'platforma_comenzi',filter:`comanda_id=eq.${encodeURIComponent(ord.comandaId)}&platforma=eq.${ord.platforma}`};
  return{table:l._table,filter:`id=eq.${l.id}`};
}
async function claimOrderLock(orderKey){
  const ord=ORDERS.find(o=>o.key===orderKey);
  if(!ord||!ord.lines.length){hideLockBanner();return;}
  const target=orderLockTarget(ord);
  let freshRows=[];
  try{
    freshRows=await sb('GET',`${target.table}?${target.filter}&select=staff_lock_by,staff_lock_at`);
  }catch(e){console.warn('lock check:',e);}
  const holder=freshRows.find(r=>r.staff_lock_by&&r.staff_lock_at);
  if(holder&&holder.staff_lock_by!==staffName){
    const ageMin=(Date.now()-new Date(holder.staff_lock_at).getTime())/60000;
    if(ageMin<LOCK_TTL_MIN)showLockBanner(holder.staff_lock_by,ageMin);else hideLockBanner();
  }else{
    hideLockBanner();
  }
  if(!staffName){stopLockHeartbeat();return;} // fără nume, doar avertismentul de mai sus — nu scriem un lock gol
  if(curKey!==orderKey)return; // navigare rapidă — nu mai scrie peste o comandă deja părăsită
  try{
    await sb('PATCH',`${target.table}?${target.filter}`,{staff_lock_by:staffName,staff_lock_at:new Date().toISOString()});
  }catch(e){console.warn('lock claim:',e);}
  startLockHeartbeat(orderKey);
}
function startLockHeartbeat(orderKey){
  if(lockHeartbeatTimer&&lockHeartbeatKey===orderKey)return;
  stopLockHeartbeat();
  lockHeartbeatKey=orderKey;
  lockHeartbeatTimer=setInterval(()=>{
    if(curKey!==orderKey||!staffName){stopLockHeartbeat();return;}
    const ord=ORDERS.find(o=>o.key===orderKey);if(!ord)return;
    const target=orderLockTarget(ord);
    sb('PATCH',`${target.table}?${target.filter}`,{staff_lock_at:new Date().toISOString()}).catch(()=>{});
  },60000);
}
function stopLockHeartbeat(){
  clearInterval(lockHeartbeatTimer);lockHeartbeatTimer=null;lockHeartbeatKey=null;
}

async function patchLine(l,body){
  await sb('PATCH',`${l._table}?id=eq.${l.id}`,body);
  Object.assign(l,body);
  // liniile din jurnal sunt obiecte SINTETICE, recreate de fiecare computeOrders() din JURNAL —
  // mutația de mai sus pe `l` se pierde la următorul recalcul dacă nu o aplicăm și pe rândul sursă.
  if(l._table==='jurnal'){
    const jr=JURNAL.find(j=>j.id===l.id);
    if(jr){
      const map={impachetat:'impachetat',impachetat_at:'impachetat_at',fara_stoc:'fara_stoc',fara_stoc_at:'fara_stoc_at',
        staff_blocked:'staff_blocked',staff_blocked_at:'staff_blocked_at',staff_issue_type:'staff_issue_type',
        staff_issue_note:'staff_issue_note',staff_issue_resolved:'staff_issue_resolved'};
      Object.keys(body).forEach(k=>{if(map[k])jr[map[k]]=body[k];});
    }
  }
}

// Comandă cu UN singur produs — marele buton ÎMPACHETAT împachetează direct linia și finalizează.
async function packSingleLine(lk,orderKey){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l)return;
  lineBusy[lk]=true;renderMain();
  const prev={impachetat:l.impachetat,impachetat_at:l.impachetat_at};
  try{
    await patchLine(l,{impachetat:true,impachetat_at:new Date().toISOString()});
    logActivity('impachetat',l,null);
    computeOrders();
    lineBusy[lk]=false;
    scheduleUndo(orderKey,[{table:l._table,id:l.id,prev}],'pack');
  }catch(e){
    lineBusy[lk]=false;
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
    renderMain();
  }
}

// Anulare ÎMPACHETAT pt. comenzi cu un singur produs, după ce fereastra de 5s a trecut deja —
// declanșată prin ținere apăsată pe buton (nu un tap simplu, ca să nu se anuleze din greșeală).
let holdTimer=null;
function startHoldUnpack(lk){
  clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>{holdTimer=null;unpackSingleLine(lk);},650);
}
function cancelHoldUnpack(){
  clearTimeout(holdTimer);
  holdTimer=null;
}
async function unpackSingleLine(lk){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l)return;
  lineBusy[lk]=true;renderMain();
  try{
    await patchLine(l,{impachetat:false,impachetat_at:null});
    logActivity('impachetat_anulat',l,null);
    computeOrders();
    showToast('↩️ Împachetare anulată');
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
  }
  lineBusy[lk]=false;
  renderMain();
}

// Comandă cu produse multiple — bifează individual un produs (fără undo la nivel de linie).
async function toggleLineCheck(lk){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l)return;
  lineBusy[lk]=true;renderMain();
  const newVal=!l.impachetat;
  try{
    await patchLine(l,{impachetat:newVal,impachetat_at:newVal?new Date().toISOString():null});
    logActivity(newVal?'produs_confirmat':'produs_neconfirmat',l,null);
    computeOrders();
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
  }
  lineBusy[lk]=false;
  renderMain();
}

// Butonul mare pentru comenzi cu mai multe produse — toate liniile sunt deja confirmate individual,
// acesta doar finalizează explicit comanda (toast + undo + trecere automată).
async function finalizeOrder(orderKey){
  const key='order_'+orderKey;
  if(lineBusy[key])return;
  const ord=ORDERS.find(o=>o.key===orderKey);if(!ord)return;
  lineBusy[key]=true;renderMain();
  logActivity('comanda_finalizata',ord.lines[0],{comandaId:ord.comandaId});
  lineBusy[key]=false;
  scheduleUndo(orderKey,[],'pack');
}

function scheduleUndo(orderKey,lineChanges,type){
  if(pendingUndo)clearTimeout(pendingUndo.timeoutId);
  const timeoutId=setTimeout(()=>{pendingUndo=null;hideToast();advanceAfterAction(orderKey);},5000);
  pendingUndo={orderKey,lines:lineChanges,timeoutId,type};
  const msg=type==='pack'?'✓ Comanda a fost împachetată':'⏸ Comandă mutată în „În așteptare"';
  showToast(msg,undoAction);
  computeOrders();
  renderMain();
}

async function undoAction(){
  if(!pendingUndo)return;
  clearTimeout(pendingUndo.timeoutId);
  const {orderKey,lines}=pendingUndo;
  try{
    for(const ch of lines){
      await sb('PATCH',`${ch.table}?id=eq.${ch.id}`,ch.prev);
      const l=findLineByKey(ch.table+'_'+ch.id);
      if(l)Object.assign(l,ch.prev);
    }
    logActivity('undo',null,{orderKey});
  }catch(e){console.error(e);}
  pendingUndo=null;
  computeOrders();
  curKey=orderKey;
  renderMain();
}

function advanceAfterAction(fromKey){
  const q=activeTab==='waiting'?waitingQueue():packQueue();
  if(!q.length){curKey=null;renderMain();return;}
  const all=ORDERS;
  const idx=all.findIndex(o=>o.key===fromKey);
  const next=q.find(o=>all.findIndex(x=>x.key===o.key)>idx)||q[0];
  curKey=next.key;
  renderMain();
}

/* ── Raportează problemă (bottom sheet) ── */
function openReportSheet(orderKey){
  const ord=ORDERS.find(o=>o.key===orderKey);if(!ord)return;
  if(ord.lines.length===1){sheetCtx={lk:lineKey(ord.lines[0]),orderKey};return renderReasonSheet();}
  sheetCtx={orderKey};
  renderLinePickSheet();
}
function renderLinePickSheet(){
  const ord=ORDERS.find(o=>o.key===sheetCtx.orderKey);
  document.getElementById('sheet-body').innerHTML=`
    <div class="sheet-title">Pentru ce produs?</div>
    <div class="sheet-sub">Alege produsul la care ai o problemă</div>
    ${ord.lines.map(l=>`<button type="button" class="sheet-opt" onclick="sheetCtx.lk='${lineKey(l)}';renderReasonSheet()">${esc(l.produs_nume||'Produs')} · ${l.cantitate} buc.</button>`).join('')}
    <button type="button" class="sheet-close" onclick="closeSheet()">Renunță</button>`;
  document.getElementById('sheet-overlay').classList.add('on');
}
function renderReasonSheet(){
  document.getElementById('sheet-body').innerHTML=`
    <div class="sheet-title">Raportează o problemă</div>
    <div class="sheet-sub">Ce s-a întâmplat cu acest produs?</div>
    <button type="button" class="sheet-opt soft" onclick="renderStockLowSheet()">📉 Stoc redus</button>
    <button type="button" class="sheet-opt danger" onclick="submitIssue('stoc_zero')">🚫 Stoc zero</button>
    <button type="button" class="sheet-opt danger" onclick="submitIssue('cantitate_insuficienta')">➖ Cantitate insuficientă</button>
    <button type="button" class="sheet-opt danger" onclick="submitIssue('produs_deteriorat')">💥 Produs deteriorat</button>
    <button type="button" class="sheet-opt danger" onclick="submitIssue('produs_gresit')">🔀 Produs greșit</button>
    <button type="button" class="sheet-opt danger" onclick="submitIssue('nu_gasesc')">❓ Nu găsesc produsul</button>
    <button type="button" class="sheet-opt danger" onclick="renderOtherIssueSheet()">✏️ Altă problemă</button>
    <button type="button" class="sheet-close" onclick="closeSheet()">Renunță</button>`;
  document.getElementById('sheet-overlay').classList.add('on');
}
function renderStockLowSheet(){
  document.getElementById('sheet-body').innerHTML=`
    <div class="sheet-title">📉 Stoc redus</div>
    <div class="sheet-sub">Câte bucăți estimezi că au rămas? (doar o alertă pentru admin — nu modifică stocul, comanda continuă normal)</div>
    <div class="sheet-qty-row">
      ${['1','2','3–5','6–10','Nu știu'].map(v=>`<button type="button" class="sheet-qty-btn" onclick="submitStockReport('${v}')">${v}</button>`).join('')}
    </div>
    <button type="button" class="sheet-close" onclick="closeSheet()">Renunță</button>`;
}
function renderOtherIssueSheet(){
  document.getElementById('sheet-body').innerHTML=`
    <div class="sheet-title">✏️ Altă problemă</div>
    <textarea class="sheet-note" id="other-issue-note" placeholder="Descrie pe scurt problema…"></textarea>
    <button type="button" class="sheet-opt danger" onclick="submitIssue('alta',document.getElementById('other-issue-note').value)">Trimite</button>
    <button type="button" class="sheet-close" onclick="closeSheet()">Renunță</button>`;
}
function closeSheet(){document.getElementById('sheet-overlay').classList.remove('on');sheetCtx=null;}

async function submitStockReport(bucket){
  const l=findLineByKey(sheetCtx.lk);
  const orderKey=sheetCtx.orderKey;
  closeSheet();
  if(!l)return;
  try{
    const p=findProdus(l.produs_id);
    await sb('POST','staff_stock_reports',{source_table:l._table,source_id:l.id,product_id:l.produs_id||null,product_name:p?p.name:(l.produs_nume||''),estimated_qty_bucket:bucket,reported_by:null});
    logActivity('stoc_redus_raportat',l,{estimated_qty_bucket:bucket});
    showToast('✓ Alertă de stoc trimisă — comanda continuă normal');
  }catch(e){
    showToast('Eroare la trimitere — încearcă din nou');
    console.error(e);
  }
  curKey=orderKey;
  renderMain();
}

async function submitIssue(type,note){
  const l=findLineByKey(sheetCtx.lk);
  const orderKey=sheetCtx.orderKey;
  closeSheet();
  if(!l)return;
  const prev={staff_blocked:l.staff_blocked,staff_blocked_at:l.staff_blocked_at,staff_issue_type:l.staff_issue_type,staff_issue_note:l.staff_issue_note,fara_stoc:l.fara_stoc,fara_stoc_at:l.fara_stoc_at};
  const body={staff_blocked:true,staff_blocked_at:new Date().toISOString(),staff_issue_type:type,staff_issue_note:note||null};
  if(type==='stoc_zero'){body.fara_stoc=true;body.fara_stoc_at=body.staff_blocked_at;}
  try{
    await patchLine(l,body);
    logActivity('problema_raportata',l,{type,note:note||null});
    computeOrders();
    scheduleUndo(orderKey,[{table:l._table,id:l.id,prev}],'block');
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
    renderMain();
  }
}

/* ── În așteptare ── */
function renderWaitingTab(host){
  const q=waitingQueue();
  if(!q.length){host.innerHTML=`<div class="empty"><div class="big">✅</div><div>Nicio comandă în așteptare.</div></div>`;return;}
  if(!currentOrder()||!q.some(o=>o.key===curKey)){
    host.innerHTML=`<div class="search-page-list">${q.map(o=>waitingListItemHtml(o)).join('')}</div>`;
    return;
  }
  const ord=currentOrder();
  const plLabel=ord.platforma==='emag'?'eMAG':ord.platforma==='trendyol'?'Trendyol':'Extra';
  const linesHtml=ord.lines.map(l=>{
    const state=l.impachetat?'done':(l.staff_blocked?'blocked':'');
    return`<div class="line ${state}">${lineThumbHtml(l)}${lineInfoHtml(l,true)}</div>`;
  }).join('');
  host.innerHTML=`<div class="card waiting">
    <div class="ord-hdr">
      <span class="ord-pl ${ord.platforma}">${plLabel}</span>
      ${ord.comandaId?`<span class="ord-num">#${esc(ord.comandaId)}</span>`:''}
      <span class="ord-waiting-badge">⏸ În așteptare</span>
    </div>
    <div id="lock-banner-slot"></div>
    ${ord.awb?`<div class="awb-box"><div><div class="awb-lbl">AWB</div><div class="awb-num">${esc(ord.awb)}</div></div></div>`:''}
    <div class="lines">${linesHtml}</div>
    <button type="button" class="nav-btn" onclick="curKey=null;renderMain()">← Înapoi la listă</button>
  </div>`;
}
function waitingListItemHtml(o){
  const blockedLine=o.lines.find(l=>l.staff_blocked&&!l.staff_issue_resolved)||o.lines[0];
  const p=findProdus(blockedLine.produs_id);
  const img=p&&p.img?`<img class="list-item-th" src="${esc(imgSrc(p.img))}" onerror="this.style.display='none'">`:`<div class="list-item-th-ph">📦</div>`;
  const since=blockedLine.staff_blocked_at?timeAgo(blockedLine.staff_blocked_at):'';
  return`<div class="list-item" onclick="curKey='${o.key}';renderMain()">
    ${img}
    <div class="list-item-main">
      <div class="list-item-nm">${o.comandaId?'#'+esc(o.comandaId)+' · ':''}${esc(blockedLine.produs_nume||'')}</div>
      <div class="list-item-issue">⛔ ${esc(ISSUE_LABELS[blockedLine.staff_issue_type]||'Problemă')}</div>
    </div>
    <div class="list-item-time">${esc(since)}</div>
  </div>`;
}
function timeAgo(iso){
  const diffMin=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(diffMin<1)return'acum';
  if(diffMin<60)return diffMin+' min';
  const h=Math.round(diffMin/60);
  if(h<24)return h+' h';
  return Math.round(h/24)+' zile';
}

/* ── Finalizate azi ── */
function renderFinalizedTab(host){
  const q=finalizedTodayQueue();
  if(!q.length){host.innerHTML=`<div class="empty"><div class="big">📭</div><div>Nicio comandă finalizată azi încă.</div></div>`;return;}
  host.innerHTML=`<div class="search-page-list">${q.map(o=>{
    const l=o.lines[0];
    const p=findProdus(l.produs_id);
    const img=p&&p.img?`<img class="list-item-th" src="${esc(imgSrc(p.img))}" onerror="this.style.display='none'">`:`<div class="list-item-th-ph">📦</div>`;
    const plLabel=o.platforma==='emag'?'eMAG':o.platforma==='trendyol'?'Trendyol':'Extra';
    const at=o.lines.map(x=>x.impachetat_at).filter(Boolean).sort().slice(-1)[0];
    const nm=o.lines.map(x=>x.produs_nume).filter(Boolean).join(', ');
    return`<div class="list-item">
      ${img}
      <div class="list-item-main">
        <div class="list-item-nm">${plLabel} ${o.comandaId?'· #'+esc(o.comandaId):''}</div>
        <div class="list-item-meta">${esc(nm)}</div>
      </div>
      <div class="list-item-time">${at?new Date(at).toLocaleTimeString('ro-RO',{hour:'2-digit',minute:'2-digit'}):''}</div>
    </div>`;
  }).join('')}</div>`;
}

/* ── Căutare ── */
function matchOrder(o,q){
  const s=q.toLowerCase();
  if((o.comandaId||'').toLowerCase().includes(s))return true;
  if((o.clientNume||'').toLowerCase().includes(s))return true;
  if((o.awb||'').toLowerCase().includes(s))return true;
  return o.lines.some(l=>(l.produs_nume||l.titlu_extern||'').toLowerCase().includes(s)||(findProdus(l.produs_id)?.sku||'').toLowerCase().includes(s));
}
function renderSearchTab(host){
  host.innerHTML=`<div class="search-row search-drop" style="margin-bottom:14px">
    <input type="text" id="search-page-input" placeholder="Caută comandă, client, produs, SKU sau cod intern…" oninput="onSearchPageInput()" autofocus>
  </div><div class="search-page-list" id="search-page-results"></div>`;
}
function onSearchPageInput(){
  const q=document.getElementById('search-page-input').value.trim();
  const box=document.getElementById('search-page-results');
  if(!q){box.innerHTML='';return;}
  const hits=ORDERS.filter(o=>matchOrder(o,q));
  if(!hits.length){box.innerHTML=`<div class="empty"><div class="big">🔍</div><div>Nicio comandă găsită.</div></div>`;return;}
  box.innerHTML=hits.map(o=>{
    const l=o.lines[0];
    const p=findProdus(l.produs_id);
    const img=p&&p.img?`<img class="list-item-th" src="${esc(imgSrc(p.img))}" onerror="this.style.display='none'">`:`<div class="list-item-th-ph">📦</div>`;
    const plLabel=o.platforma==='emag'?'eMAG':o.platforma==='trendyol'?'Trendyol':'Extra';
    const nm=o.lines.map(x=>x.produs_nume).filter(Boolean).join(', ');
    const status=o.finalized?'✓ Finalizată':o.waiting?'⏸ În așteptare':'📦 De împachetat';
    return`<div class="list-item" onclick="jumpToOrder('${o.key}')">
      ${img}
      <div class="list-item-main">
        <div class="list-item-nm">${plLabel} ${o.comandaId?'· #'+esc(o.comandaId):''}</div>
        <div class="list-item-meta">${esc(nm)}${o.awb?' · AWB '+esc(o.awb):''}</div>
      </div>
      <div class="list-item-time">${status}</div>
    </div>`;
  }).join('');
}
function jumpToOrder(key){
  const ord=ORDERS.find(o=>o.key===key);if(!ord)return;
  curKey=key;
  activeTab=ord.finalized?'finalized':ord.waiting?'waiting':'pack';
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===activeTab));
  renderMain();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ── Legendă ── */
function renderLegendTab(host){
  host.innerHTML=`
    <div class="legend-sec"><h3>Statusuri comandă</h3>
      <div class="legend-row"><b>Nouă</b><span>Comandă nou intrată, nimeni nu a lucrat încă la ea</span></div>
      <div class="legend-row"><b>În lucru</b><span>Comandă aflată în procesare de către un angajat</span></div>
      <div class="legend-row"><b>Împachetată</b><span>Pregătirea a fost finalizată</span></div>
      <div class="legend-row"><b>În așteptare</b><span>Există o problemă raportată care trebuie rezolvată înainte să continue</span></div>
      <div class="legend-row"><b>Expediată</b><span>Procesul logistic a fost finalizat (curier ridicat coletul)</span></div>
    </div>
    <div class="legend-sec"><h3>Raportare probleme</h3>
      <div class="legend-row"><b>Stoc redus</b><span>Doar o alertă pentru admin — NU modifică stocul, comanda poate continua normal</span></div>
      <div class="legend-row"><b>Stoc zero / alte probleme</b><span>Opresc comanda — trece în „În așteptare" până se rezolvă</span></div>
      <div class="legend-row"><b>Undo</b><span>5 secunde după ÎMPACHETAT sau o problemă raportată, poți anula acțiunea din mesajul care apare jos</span></div>
      <div class="legend-row"><b>Anulare mai târziu</b><span>La o comandă cu un singur produs, chiar și după cele 5 secunde — ține apăsat pe butonul ÎMPACHETAT (verde) ca să anulezi</span></div>
      <div class="legend-row"><b>Raportează problemă</b><span>Deschide o listă de motive — alege ce s-a întâmplat cu produsul</span></div>
    </div>`;
}

document.addEventListener('click',ev=>{
  if(!ev.target.closest('.search-drop'))document.getElementById('search-results')?.classList.remove('on');
});

function startPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(()=>{
    // nu reîmprospăta peste un sheet deschis sau un undo în așteptare — ar smulge ecranul de sub deget
    if(sheetCtx||pendingUndo)return;
    refreshData();
  },25000);
}

async function refreshData(){
  try{
    const [comRows,jurnalRows]=await Promise.all([
      sb('GET',`platforma_comenzi?select=*&created_at=gte.${CUTOFF_DATE}&order=created_at.asc`),
      sb('GET',`jurnal?select=*&data=gte.${CUTOFF_DATE}&order=data.asc`).catch(()=>JURNAL)
    ]);
    COMENZI=comRows;JURNAL=jurnalRows;
    document.getElementById('sync-dot').className='sync-dot ok';
    computeOrders();
    renderMain();
  }catch(e){
    document.getElementById('sync-dot').className='sync-dot err';
    console.warn('refresh eșuat:',e);
  }
}

async function load(){
  renderStaffNameBadge();
  try{
    const [prodRows,comRows]=await Promise.all([
      sb('GET','produse?select=id,name,sku,internal_code,img,images,bought,sold&order=id.asc'),
      sb('GET',`platforma_comenzi?select=*&created_at=gte.${CUTOFF_DATE}&order=created_at.asc`),
    ]);
    PRODUSE=prodRows.map(p=>({...p,internalCode:p.internal_code}));
    COMENZI=comRows;
    try{
      JURNAL=await sb('GET',`jurnal?select=*&data=gte.${CUTOFF_DATE}&order=data.asc`);
    }catch(e){
      JURNAL=[];
      console.warn('Nu am putut încărca vânzările directe din Jurnal (rulează migration_jurnal_packing.sql):',e);
    }
    document.getElementById('sync-dot').className='sync-dot ok';
    computeOrders();
    pickInitialOrder(packQueue());
    renderMain();
    startPolling();
  }catch(e){
    document.getElementById('sync-dot').className='sync-dot err';
    document.getElementById('progress-txt').textContent='Eroare de conexiune';
    document.getElementById('main-area').innerHTML=`<div class="empty"><div class="big">⚠️</div><div>Nu m-am putut conecta la baza de date.<br>Reîncarcă pagina.</div></div>`;
    console.error(e);
  }
}
load();
</script>
