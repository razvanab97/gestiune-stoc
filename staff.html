      <div class="legend-row"><b>Minimizează</b><span>Dacă nu e de rezolvat chiar atunci, se poate minimiza — rămâne un buton 📨 flotant jos-dreapta, cu numărul celor nerezolvate, până le confirmi</span></div>
    </div>`;
}

/* ── Mesaje/task-uri de la Admin (tabela staff_mesaje) ── */
let msgPopupMinimized=false,seenMsgIds=new Set();
function renderMsgPopup(){
  const pending=STAFFMSG.filter(m=>!m.rezolvat);
  const badgeBtn=document.getElementById('msg-badge-btn');
  if(!pending.length){
    document.getElementById('msg-overlay').classList.remove('on');
    badgeBtn.classList.remove('on');
    return;
  }
  document.getElementById('msg-badge-count').textContent=pending.length;
  badgeBtn.classList.add('on');
  // Un mesaj nou (necunoscut până acum) forțează redeschiderea mare, chiar dacă anterior era minimizat —
  // minimizarea ține doar cât timp NU apare nimic nou de citit.
  if(pending.some(m=>!seenMsgIds.has(m.id)))msgPopupMinimized=false;
  document.getElementById('msg-overlay').classList.toggle('on',!msgPopupMinimized);
  document.getElementById('msg-list').innerHTML=pending.map(m=>`<div class="msg-item">
    <div class="msg-item-tip ${m.tip==='task'?'task':''}">${m.tip==='task'?'✅ TASK':'💬 MESAJ'}</div>
    <div class="msg-item-txt">${esc(m.text)}</div>
    <div class="msg-item-time">acum ${esc(timeAgo(m.created_at))}</div>
    <button type="button" class="msg-item-done-btn" ${lineBusy['msg_'+m.id]?'disabled':''} onclick="resolveMsg(${m.id})">${m.tip==='task'?'✓ Rezolvat':'✓ Am înțeles'}</button>
  </div>`).join('');
  pending.forEach(m=>seenMsgIds.add(m.id));
}
function openMsgPopup(){msgPopupMinimized=false;renderMsgPopup();}
function minimizeMsgPopup(){msgPopupMinimized=true;renderMsgPopup();}
async function resolveMsg(id){
  const key='msg_'+id;
  if(lineBusy[key])return;
  const m=STAFFMSG.find(x=>x.id===id);if(!m)return;
  lineBusy[key]=true;renderMsgPopup();
  try{
    await sb('PATCH',`staff_mesaje?id=eq.${id}`,{rezolvat:true,rezolvat_at:new Date().toISOString(),rezolvat_by:staffName||null});
    m.rezolvat=true;
    logActivity('mesaj_rezolvat',null,{id,text:m.text});
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
  }
  lineBusy[key]=false;
  renderMsgPopup();
}

document.addEventListener('click',ev=>{
  if(!ev.target.closest('.search-drop'))document.getElementById('search-results')?.classList.remove('on');
});
// Safari poate interpreta dublu-tap ca zoom chiar cu viewport blocat; Staff este un ecran de lucru,
// deci păstrăm permanent scala și evităm mutarea accidentală a cadrului.
document.addEventListener('dblclick',ev=>ev.preventDefault(),{passive:false});
document.addEventListener('gesturestart',ev=>ev.preventDefault(),{passive:false});

function startPolling(){
  clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    // nu reîmprospăta peste un sheet deschis, un undo în așteptare sau camera de scanare — ar smulge
    // ecranul de sub deget (sau ar rescrie #main-area cât timp video-ul de scanare stă peste el)
    if(document.hidden||sheetCtx||pendingUndo||scannerOpen||document.activeElement?.matches('input,textarea,select'))return;
    // checkAutoQueueReset face deja un refreshData() intern dacă resetează — evităm un al doilea,
    // redundant, imediat după.
    const didAutoReset=await checkAutoQueueReset();
    if(!didAutoReset)refreshData();
  },25000);
}

function setStaffRefreshButton(busy){
  const b=document.getElementById('staff-refresh-btn');if(!b)return;
  b.disabled=!!busy;b.textContent=busy?'↻ Se încarcă…':'↻ Reîncarcă';
}
async function refreshStaffNow(){
  if(refreshInFlight){showToast('Staff se actualizează deja…');return;}
  setStaffRefreshButton(true);
  try{
    // Reîncarcă și produsele, nu doar comenzile: o asociere sau un produs adăugat recent în ERP devine
    // disponibil pe Staff imediat, fără refresh de browser și fără cache local intermediar.
    const prodRows=await sb('GET','produse?select=id,name,sku,ean,internal_code,img,images,bought,sold,price_buy_ttc,archived&order=id.asc');
    PRODUSE=prodRows.map(p=>({...p,internalCode:p.internal_code}));
    // Pragul de coadă se verifică doar aici și la încărcarea inițială (load()), nu la fiecare
    // reîmprospătare automată (25s/visibilitychange/online) — „Coadă nouă” a devenit o acțiune rară,
    // nu zilnică, nu merită încă un apel Supabase la fiecare tick doar pentru un caz de urgență.
    await loadStaffQueueStart();
    const ok=await refreshData();
    if(ok)showToast(`✓ Staff actualizat · ${ORDERS.length} comenzi citite din ERP`);
    else showToast('Nu am putut reîncărca toate datele — verifică conexiunea');
  }catch(e){
    console.error(e);document.getElementById('sync-dot').className='sync-dot err';
    showToast('Eroare la reîncărcare — încearcă din nou');
  }finally{setStaffRefreshButton(false);}
}

// Degradare controlată dacă migration_staff_coada_anulare.sql nu a rulat încă: reîncearcă fără
// filtrul pe `anulata`, ca Staff să rămână funcțional (doar fără curățarea prin „Anulează"), nu blocat.
async function sbComenzi(url){
  try{return await sb('GET',url);}
  catch(e){
    if(/anulata/i.test(String(e.message||e))&&url.includes('&anulata=eq.false'))return sb('GET',url.replace('&anulata=eq.false',''));
    throw e;
  }
}
function queueDate(){return String(staffQueueStartedAt||CUTOFF_DATE).slice(0,10);}
function afterStaffQueueStart(row){
  // Unele rânduri vechi de jurnal nu aveau created_at. Nu le tratăm ca fiind noi doar pentru că
  // au aceeași dată calendaristică; după reset, coada trebuie să fie efectiv goală.
  return !!row?.created_at&&String(row.created_at)>=String(staffQueueStartedAt);
}
async function loadStaffQueueStart(){
  try{
    const rows=await sb('GET',`setari_app?key=eq.${STAFF_QUEUE_KEY}&select=value`);
    const v=rows?.[0]?.value;
    if(v&&!Number.isNaN(new Date(v).getTime()))staffQueueStartedAt=v;
  }catch(e){console.warn('prag coadă Staff indisponibil:',e);}
}
async function resetStaffQueue(){
  const text='Pornești o coadă nouă de acum? Comenzile deja existente rămân în ERP, jurnal și istoric, dar nu vor mai apărea în Staff.';
  if(!confirm(text))return;
  const b=document.getElementById('staff-queue-reset-btn');if(b)b.disabled=true;
  const startedAt=new Date().toISOString();
  try{
    const updated=await sb('PATCH',`setari_app?key=eq.${STAFF_QUEUE_KEY}`,{value:startedAt});
    if(!updated?.length)await sb('POST','setari_app',{key:STAFF_QUEUE_KEY,value:startedAt});
    staffQueueStartedAt=startedAt;
    curKey=null;
    await refreshData();
    showToast('✓ Coada Staff este goală. Comenzile noi vor intra de acum.');
  }catch(e){
    console.error(e);showToast('Nu am putut reseta coada — încearcă din nou');
  }finally{if(b)b.disabled=false;}
}
// Coadă nouă automată zilnic la 22:00 — cerut direct („comenzile împachetate să se reseteze în
// fiecare zi la ora 16 și să pregătească platforma pentru ziua următoare", pragul mutat ulterior de la
// 16:00 la 22:00, tot cerut direct). Aceeași acțiune ca „↺ Coadă nouă" manual, dar fără confirm()
// (rulează singură, nesupravegheată) și fără să se repete la fiecare tick de poll după ce a trecut ora
// 22 — se declanșează o SINGURĂ dată, comparând pragul curent (staffQueueStartedAt) cu 22:00 de azi:
// dacă ultimul reset e deja după acel prag, nu mai repetă.
// Verificată atât la încărcarea inițială (tableta pornită/reîmprospătată după ora 22), cât și la
// fiecare tick de poll (tableta rămasă deschisă peste ora 22). Întoarce true dacă a resetat, ca
// apelantul din poll să nu mai ceară și un refreshData() separat, redundant.
function todayAt22(){const d=new Date();d.setHours(22,0,0,0);return d;}
async function checkAutoQueueReset(){
  const threshold=todayAt22();
  const now=new Date();
  if(now<threshold)return false;
  if(staffQueueStartedAt&&new Date(staffQueueStartedAt)>=threshold)return false;
  const startedAt=new Date().toISOString();
  try{
    const updated=await sb('PATCH',`setari_app?key=eq.${STAFF_QUEUE_KEY}`,{value:startedAt});
    if(!updated?.length)await sb('POST','setari_app',{key:STAFF_QUEUE_KEY,value:startedAt});
    staffQueueStartedAt=startedAt;
    curKey=null;
    await refreshData();
    showToast('🕓 Coadă nouă pornită automat (22:00) — platforma e pregătită pentru ziua următoare.');
    return true;
  }catch(e){
    console.warn('Reset automat coadă eșuat (reîncearcă la următorul ciclu):',e);
    return false;
  }
}

async function refreshData(){
  // Două tick-uri apropiate, revenirea în tab sau un refresh cerut de un flux
  // nu mai pot porni citiri paralele ale acelorași patru tabele.
  if(refreshInFlight){refreshQueued=true;return;}
  if(document.hidden)return;
  refreshInFlight=true;let ok=false;
  try{
    const [comRows,jurnalRows,prepackRows,msgRows,furnizorRows]=await Promise.all([
      sbComenzi(`platforma_comenzi?select=*&created_at=gte.${encodeURIComponent(staffQueueStartedAt)}&anulata=eq.false&order=created_at.asc`),
      sbComenzi(`jurnal?select=*&data=gte.${queueDate()}&anulata=eq.false&order=data.asc`).catch(()=>JURNAL),
      sb('GET','pre_impachetate?select=*&folosit_la=is.null&order=created_at.asc').catch(()=>PREPACK),
      sb('GET','staff_mesaje?select=*&rezolvat=is.false&order=created_at.asc').catch(()=>STAFFMSG),
      sb('GET','comenzi_furnizor?select=*&finalizat=eq.false&order=created_at.asc').catch(e=>{console.warn('comenzi_furnizor indisponibil (rulează migration_comenzi_furnizor.sql):',e);return FURNIZOR;})
    ]);
    COMENZI=comRows;JURNAL=jurnalRows.filter(afterStaffQueueStart);PREPACK=prepackRows;STAFFMSG=msgRows;FURNIZOR=furnizorRows;
    document.getElementById('sync-dot').className='sync-dot ok';
    computeOrders();
    renderMain();
    renderMsgPopup();
    ok=true;
  }catch(e){
    document.getElementById('sync-dot').className='sync-dot err';
    console.warn('refresh eșuat:',e);
  }finally{
    refreshInFlight=false;
    if(refreshQueued&&!document.hidden){refreshQueued=false;refreshData();}
  }
  return ok;
}

// Refresh-ul este intenționat manual: Staff nu schimbă lista de sub operator când revine în tab,
// reapare rețeaua sau trece timpul. Butonul „↻ Reîncarcă” aduce numai informația cerută explicit.
// Reparație (raportată direct: „comenzile de ieri, unele deja împachetate, tot apar" + „ce s-a
// întâmplat cu resetul de la 22:00?"): eliminarea pollingului de mai sus (fostul startPolling, scos la
// trecerea pe refresh manual) a lăsat verificarea pragului de 22:00 (checkAutoQueueReset) fără NICIUN
// declanșator cât timp tableta rămâne deschisă peste noapte — doar o reîncărcare completă de pagină
// după ora 22 mai prindea reset-ul. Interval SEPARAT, dedicat STRICT acestei verificări (nu reface
// lista, nu are legătură cu refresh-ul manual de mai sus): checkAutoQueueReset iese imediat, fără
// niciun efect vizibil, dacă nu s-a trecut încă de pragul zilei — reface ecranul o SINGURĂ dată pe zi,
// exact în noaptea în care trece de ora 22, nu la fiecare tick.
setInterval(()=>{if(!document.hidden)checkAutoQueueReset();},60000);
// Safari pe iPad nu micșorează mereu corect 100dvh la apariția tastaturii. Folosim viewportul real
// vizibil, ca bara de Căutare să rămână imediat deasupra tastaturii și textul introdus să se vadă.
function syncStaffViewport(){
  const h=Math.round(window.visualViewport?.height||window.innerHeight);
  document.documentElement.style.setProperty('--staff-vh',h+'px');
}
syncStaffViewport();
window.visualViewport?.addEventListener('resize',syncStaffViewport);
window.visualViewport?.addEventListener('scroll',()=>{syncStaffViewport();pinStaffFrame();});
window.addEventListener('orientationchange',()=>setTimeout(syncStaffViewport,150));

async function load(){
  renderStaffNameBadge();
  try{
    await loadStaffQueueStart();
    const [prodRows,comRows,prepackRows,msgRows,furnizorRows]=await Promise.all([
      sb('GET','produse?select=id,name,sku,ean,internal_code,img,images,bought,sold,price_buy_ttc,archived&order=id.asc'),
      sbComenzi(`platforma_comenzi?select=*&created_at=gte.${encodeURIComponent(staffQueueStartedAt)}&anulata=eq.false&order=created_at.asc`),
      sb('GET','pre_impachetate?select=*&folosit_la=is.null&order=created_at.asc').catch(e=>{console.warn('pre_impachetate indisponibil:',e);return[];}),
      sb('GET','staff_mesaje?select=*&rezolvat=is.false&order=created_at.asc').catch(e=>{console.warn('staff_mesaje indisponibil:',e);return[];}),
      sb('GET','comenzi_furnizor?select=*&finalizat=eq.false&order=created_at.asc').catch(e=>{console.warn('comenzi_furnizor indisponibil (rulează migration_comenzi_furnizor.sql):',e);return[];}),
    ]);
    PRODUSE=prodRows.map(p=>({...p,internalCode:p.internal_code}));
    COMENZI=comRows;
    PREPACK=prepackRows;
    STAFFMSG=msgRows;
    FURNIZOR=furnizorRows;
    try{
      JURNAL=(await sbComenzi(`jurnal?select=*&data=gte.${queueDate()}&anulata=eq.false&order=data.asc`)).filter(afterStaffQueueStart);
    }catch(e){
      JURNAL=[];
      console.warn('Nu am putut încărca vânzările directe din Jurnal (rulează migration_jurnal_packing.sql):',e);
    }
    document.getElementById('sync-dot').className='sync-dot ok';
    computeOrders();
    pickInitialOrder(packQueue());
    renderMain();
    renderMsgPopup();
    // Tableta poate fi pornită/reîncărcată DUPĂ ora 22 (nu doar rămasă deschisă peste ea) — verificăm
    // și aici, nu doar în poll, ca reset-ul automat să nu aștepte până la 25 de secunde degeaba.
    checkAutoQueueReset();
  }catch(e){
    document.getElementById('sync-dot').className='sync-dot err';
    document.getElementById('progress-txt').textContent='Eroare de conexiune';
    document.getElementById('main-area').innerHTML=`<div class="empty"><div class="big">⚠️</div><div>Nu m-am putut conecta la baza de date.<br>Reîncarcă pagina.</div></div>`;
    console.error(e);
  }
}
load();
</script>
