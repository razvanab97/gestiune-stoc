<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Comenzi de împachetat - AB HOMES</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600;700&display=swap');
:root{
  --bg:#F7F7FA;--surf:#FFFFFF;--surf2:#F9F9FB;
  --b1:#E7E7EC;--b2:#E7E7EC;--b3:#D3D3DC;
  --t1:#17181C;--t2:#3F4451;--t3:#70727D;
  --acc:#7657F6;--acc2:#6342E8;--acc-fg:#FFFFFF;--acc-light:#F3F0FF;
  --gr:#12B76A;--gr-bg:#ECFDF3;
  --rd:#F04438;--rd-bg:#FEF3F2;
  --or:#F79009;--or-bg:#FFFAEB;
  --r:10px;--r2:14px;--r3:20px;
  --font:'Source Sans 3',Arial,sans-serif;--mono:'Geist Mono','Roboto Mono',monospace;
  --sh2:0 4px 16px rgba(16,24,40,.06);
  /* liquid glass, mai discret — cerut direct, „mai premium, mai minimalist": blur redus (22→14px),
     saturație redusă, fundal cu O SINGURĂ nuanță de glow, foarte estompată, în loc de trei culori
     competitive (mov/verde/portocaliu) — păstrează caracterul de sticlă, fără aglomerare vizuală. */
  --glass:rgba(255,255,255,.66);--glass-strong:rgba(255,255,255,.86);
  --glass-bd:rgba(255,255,255,.75);--glass-blur:blur(14px) saturate(140%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0;font-family:var(--font);color:var(--t1);font-size:23px;font-weight:500;line-height:1.4;height:var(--staff-vh,100dvh);min-height:0;-webkit-font-smoothing:antialiased;touch-action:manipulation;
  background:
    radial-gradient(1200px 800px at 20% -10%,rgba(118,87,246,.09),transparent 55%),
    var(--bg);
  background-attachment:fixed;
}
button,input,select,textarea,optgroup,option{font-family:inherit}
button{cursor:pointer}
.wrap{width:100%;max-width:1120px;height:var(--staff-vh,100dvh);min-height:0;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:grid;grid-template-rows:auto auto auto auto minmax(0,1fr);overflow:hidden}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.hdr-title{display:flex;align-items:baseline;gap:10px;min-width:0}
.hdr h1{font-size:27px;font-weight:700}
.order-count{font-size:17px;color:var(--t3);font-weight:700;white-space:nowrap}
.update-btn{border:1px solid var(--b2);background:var(--surf);color:var(--t2);border-radius:999px;padding:4px 9px;font-size:13px;font-weight:800;white-space:nowrap}.update-btn.new{border-color:var(--acc);background:var(--acc-light);color:var(--acc)}
.refresh-btn{border:1px solid var(--b2);background:var(--surf);color:var(--t2);border-radius:999px;padding:6px 10px;font-size:14px;font-weight:800;white-space:nowrap}.refresh-btn:active{background:var(--acc-light);border-color:var(--acc);color:var(--acc)}.refresh-btn:disabled{opacity:.55;cursor:wait}.queue-reset-btn{border-color:#f1c9b8;color:#a44a21;background:#fffaf7}.queue-reset-btn:active{background:#fff0e8;border-color:#df8a60;color:#8d3612}
.sync-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.sync-dot.ok{background:var(--gr)}
.sync-dot.err{background:var(--rd)}
.progress-txt{font-size:19px;color:var(--t3);font-weight:600}
.progress-bar-wrap{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.progress-bar{flex:1;height:10px;border-radius:999px;background:var(--b1);overflow:hidden}
.progress-bar-fill{height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:999px;transition:width .3s}
.progress-pct{font-family:var(--mono);font-size:17px;color:var(--t3);font-weight:700;flex-shrink:0}

/* NAV — 5 secțiuni, simplu, touch-friendly */
.tabbar{display:flex;gap:8px;margin-bottom:18px;background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);box-shadow:var(--sh2);border-radius:var(--r2);padding:6px;overflow-x:auto}
.tab-btn{flex:1;min-width:84px;padding:12px 6px;border-radius:var(--r);border:none;background:transparent;color:var(--t3);font-size:16px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;white-space:nowrap}
.tab-btn .ic{font-size:23px}
.tab-btn.on{background:var(--acc-light);color:var(--acc)}
.tab-badge{background:var(--rd);color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:0 6px;min-width:16px;display:inline-block;margin-left:2px}
#main-area{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 2px 12px;scrollbar-gutter:stable}
#search-dock:empty{height:0;overflow:hidden}

.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-row input{flex:1;font-size:21px;padding:14px 16px;border:1px solid var(--b2);border-radius:var(--r2);background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.search-row input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-light)}
.search-drop{position:relative}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r2);box-shadow:var(--sh2);max-height:320px;overflow-y:auto;z-index:20;display:none}
.search-results.on{display:block}
.search-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--b1);font-size:19px}
.search-item:last-child{border-bottom:none}
.search-item:active{background:var(--surf2)}
.search-item b{color:var(--acc)}
.search-page-list{display:flex;flex-direction:column;gap:10px}

.empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--t3);text-align:center;padding:40px 20px}
.empty .big{font-size:61px}

.card{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r3);box-shadow:0 12px 40px rgba(16,24,40,.08),inset 0 1px 0 rgba(255,255,255,.6);padding:30px;min-height:100%;display:flex;flex-direction:column;gap:22px}
.card.finalized{border-color:rgba(18,183,106,.4);background:linear-gradient(180deg,rgba(236,253,243,.75),var(--glass) 140px)}
.card.waiting{border-color:rgba(247,144,9,.45)}
.ord-hdr{display:flex;flex-direction:column;gap:8px;padding-bottom:16px;border-bottom:1px solid var(--b1)}
.ord-hdr-row1{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.ord-pl{font-weight:700;padding:4px 12px;border-radius:999px;font-size:17px}
.ord-pl.emag{background:var(--acc-light);color:var(--acc)}
.ord-pl.trendyol{background:var(--or-bg);color:var(--or)}
.ord-pl.direct{background:var(--surf2);color:var(--t2)}
.ord-pl.vinted{background:var(--gr-bg);color:var(--gr)}
.ord-num{font-family:var(--mono);font-weight:700;font-size:35px}
.ord-client{font-weight:700;font-size:35px;color:var(--t1)}
.ord-date{color:var(--t3);font-size:17px;margin-left:auto}
.ord-finalized-badge{background:var(--gr-bg);color:var(--gr);font-weight:700;padding:4px 12px;border-radius:999px;font-size:16px}
.ord-waiting-badge{background:var(--or-bg);color:var(--or);font-weight:700;padding:4px 12px;border-radius:999px;font-size:16px}
/* Prezență/blocare moale (Faza 2) — doar avertisment, angajatul poate continua oricând, decizie
   confirmată direct. Nu e o măsură de securitate (nume din localStorage, peste cheia anon expusă). */
.lock-banner{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--or-bg);color:#92400e;border-radius:var(--r2);font-size:17px;font-weight:600}
.staff-name-badge{background:none;border:1px solid var(--b2);color:var(--t2);font-size:16px;font-weight:700;padding:6px 12px;border-radius:999px;flex-shrink:0}
.staff-name-badge:active{background:var(--surf2)}

.awb-box{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;background:linear-gradient(135deg,rgba(243,240,255,.75),rgba(255,255,255,.55));backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(118,87,246,.25);border-radius:var(--r2)}
.awb-lbl{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--acc2)}
.awb-num{font-family:var(--mono);font-weight:800;font-size:29px;color:var(--t1);word-break:break-all}
.awb-num-tail{font-size:41px;color:#1D4ED8;margin-left:2px}
.awb-pending{color:var(--t3);font-size:17px;font-weight:600}

.progress-mini{font-size:17px;color:var(--t3);font-weight:700}

.lines{display:flex;flex-direction:column;gap:20px}
.line{display:flex;gap:22px;padding:22px;border:1px solid var(--glass-bd);border-radius:var(--r2);flex-wrap:wrap;position:relative;background:rgba(255,255,255,.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.line.done{border-color:rgba(18,183,106,.4);background:rgba(236,253,243,.55)}
.line.blocked{border-color:rgba(240,68,56,.4);background:rgba(254,243,242,.55)}
.line-img-wrap{flex-shrink:0;width:172px}
.line-img{width:172px;height:172px;border-radius:var(--r);object-fit:cover;border:1px solid var(--b1);background:var(--surf2);cursor:pointer}
.line-img-ph{width:172px;height:172px;border-radius:var(--r);background:var(--surf2);border:1px dashed var(--b2);display:flex;align-items:center;justify-content:center;font-size:61px}
.line-thumbs{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.line-thumb{width:34px;height:34px;border-radius:6px;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:.6}
.line-thumb.active{border-color:var(--acc);opacity:1}
.line-info{flex:1;min-width:220px;display:flex;flex-direction:column;gap:8px}
.line-nm{font-weight:700;font-size:27px}
.line-meta{color:var(--t3);font-size:19px}
.line-qty-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-top:4px}
.line-qty-box{margin-top:2px}
.line-stock-box{margin-top:2px;margin-left:auto;text-align:right}
.line-qty-lbl{font-size:15px;color:var(--t3);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.line-qty{font-family:var(--mono);font-weight:800;font-size:37px;color:var(--acc);line-height:1.15}
.line-stock{font-family:var(--mono);font-weight:700;font-size:20px;color:var(--t3);line-height:1.3}
.line-stock.low{color:var(--or)}
.line-stock.zero{color:var(--rd)}
.line-issue{margin-top:4px;font-size:17px;color:var(--rd);font-weight:700}
.line-check{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;border:2px solid var(--b2);background:var(--surf);font-size:18px;font-weight:700;color:var(--t2);margin-top:6px}
.line-check.on{background:var(--gr);border-color:var(--gr);color:#fff}
/* Folosit doar de tab-ul separat „🏷️ Pre-împachetate" (butonul Confirmă din listă) — fluxul normal
   de împachetare nu are nicio ramură/culoare specială pentru pre-împachetare, intenționat. */
.line-check.prepacked{background:var(--or-bg);border-color:var(--or);color:#92400e}

.big-pack-btn{width:100%;padding:26px 16px;border-radius:var(--r3);border:none;background:var(--acc);color:#fff;font-size:27px;font-weight:800;box-shadow:0 10px 26px rgba(118,87,246,.35),inset 0 1px 0 rgba(255,255,255,.35);letter-spacing:.02em;min-height:80px}
.big-pack-btn:active{background:var(--acc2)}
.big-pack-btn:disabled{background:var(--b2);color:var(--t3);box-shadow:none;cursor:default}
.big-pack-btn.done{background:var(--gr);box-shadow:0 10px 26px rgba(18,183,106,.3),inset 0 1px 0 rgba(255,255,255,.35);font-size:22px}
.big-pack-btn.done:active{background:#0e9c5c}

.nav-row{display:flex;gap:12px;margin-top:10px;flex-wrap:wrap}
.nav-btn{flex:1;padding:20px;border-radius:var(--r2);border:1px solid var(--glass-bd);background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:21px;font-weight:700;color:var(--t1);min-height:72px}
.nav-btn:disabled{opacity:.4}
.report-btn{flex:0 0 auto;padding:0 18px;border-radius:var(--r2);border:1px solid var(--glass-bd);background:var(--glass-strong);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:16px;font-weight:700;color:var(--t2);min-height:72px;white-space:nowrap}
.report-btn:active{background:var(--surf2)}
.cf-order{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r3);box-shadow:0 12px 40px rgba(16,24,40,.08);padding:20px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.cf-line{padding:12px 0;border-top:1px solid var(--b1)}
.cf-line:first-of-type{border-top:0;padding-top:0}
.cf-line-top{display:flex;align-items:flex-start;gap:16px}
.cf-line-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px}
.cf-qty-input{width:70px;padding:8px 6px;border-radius:8px;border:1px solid var(--b2);background:var(--surf);font-size:16px;text-align:center}

/* liste (În așteptare / Finalizate / Căutare) */
.list-item{display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r2);cursor:pointer}
.list-item:active{background:rgba(255,255,255,.4)}
.list-item-th{width:56px;height:56px;border-radius:var(--r);object-fit:cover;flex-shrink:0;background:var(--surf2);border:1px solid var(--b1)}
.list-item-th-ph{width:56px;height:56px;border-radius:var(--r);flex-shrink:0;background:var(--surf2);border:1px dashed var(--b2);display:flex;align-items:center;justify-content:center;font-size:27px}
.list-item-main{flex:1;min-width:0}
.list-item-nm{font-weight:700;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list-item-meta{color:var(--t3);font-size:16px;margin-top:2px}
.list-item-issue{color:var(--rd);font-size:16px;font-weight:700;margin-top:2px}
.list-item-time{color:var(--t3);font-size:15px;flex-shrink:0}
.list-item-ready{color:var(--gr);font-size:16px;font-weight:800;margin-top:2px}
.list-item-ready-row{border-color:var(--gr)}

/* Raport stoc operațional — folosește aceeași tabelă produse ca platforma principală, nu un cache local. */
.stock-card{justify-content:center}.stock-card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--b1)}.stock-card-title{font-size:25px;font-weight:800}.stock-card-pos{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--t3);white-space:nowrap}.stock-product{display:flex;align-items:center;gap:24px;padding:4px 0}.stock-product-img,.stock-product-ph{width:180px;height:180px;flex-shrink:0;border-radius:var(--r2);object-fit:cover;border:1px solid var(--b1);background:var(--surf2);box-shadow:0 8px 20px rgba(16,24,40,.08)}.stock-product-ph{display:flex;align-items:center;justify-content:center;font-size:64px}.stock-product-info{min-width:0;flex:1}.stock-product-name{font-size:29px;font-weight:800;line-height:1.18}.stock-product-meta{font-family:var(--mono);font-size:16px;color:var(--t3);margin-top:7px}.stock-values{display:flex;gap:12px;margin-top:14px}.stock-value{flex:1;padding:12px 14px;border-radius:var(--r2);background:var(--surf2);border:1px solid var(--b1)}.stock-value-lbl{font-size:13px;color:var(--t3);font-weight:800;text-transform:uppercase;letter-spacing:.04em}.stock-value-num{font-family:var(--mono);font-size:30px;font-weight:800;margin-top:2px}.stock-value-num.low{color:var(--or)}.stock-value-num.zero{color:var(--rd)}.stock-entry{display:flex;gap:10px}.stock-entry input{flex:1;min-width:0;padding:14px 16px;border:2px solid var(--b2);border-radius:var(--r2);font-family:var(--mono);font-size:24px;font-weight:700}.stock-entry input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-light)}.stock-entry button{flex:1.1}.stock-nav-row{display:flex;gap:12px}.stock-nav-row .nav-btn{margin:0}.stock-saved{font-size:16px;color:var(--gr);font-weight:700;text-align:center;min-height:22px}

/* Legendă */
.legend-sec{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border:1px solid var(--glass-bd);border-radius:var(--r2);padding:18px 20px;margin-bottom:14px}
.legend-sec h3{font-size:20px;margin-bottom:8px;color:var(--t1)}
.legend-row{display:flex;gap:10px;padding:6px 0;font-size:18px;color:var(--t2);border-bottom:1px solid var(--b1)}
.legend-row:last-child{border-bottom:none}
.legend-row b{color:var(--t1);flex-shrink:0;min-width:150px}

/* bottom sheet */
.sheet-overlay{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:200;display:none;align-items:flex-end;justify-content:center}
.sheet-overlay.on{display:flex}
.sheet{background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur);border-top:1px solid var(--glass-bd);border-radius:22px 22px 0 0;width:100%;max-width:600px;max-height:85dvh;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:20px 20px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(16,24,40,.2)}
.sheet-title{font-size:23px;font-weight:800;margin-bottom:4px}
.sheet-sub{font-size:18px;color:var(--t3);margin-bottom:16px}
.sheet-opt{width:100%;text-align:left;padding:18px 18px;border-radius:var(--r2);border:1px solid var(--b1);background:var(--surf2);font-size:20px;font-weight:700;color:var(--t1);margin-bottom:10px;min-height:64px}
.sheet-opt:active{background:var(--b1)}
.sheet-opt.danger{color:var(--rd)}
.sheet-opt.soft{color:var(--or)}
.sheet-qty-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.sheet-qty-btn{flex:1;min-width:70px;padding:16px 8px;border-radius:var(--r2);border:2px solid var(--b2);background:var(--surf);font-size:20px;font-weight:800;color:var(--t2)}
.sheet-qty-btn:active{background:var(--acc-light);border-color:var(--acc)}
.sheet-close{width:100%;padding:16px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--surf);font-size:19px;font-weight:700;color:var(--t2)}
.sheet-note{width:100%;padding:12px 14px;border:1px solid var(--b2);border-radius:var(--r2);font-size:18px;font-family:var(--font);margin-bottom:14px;resize:vertical;min-height:70px}

.scan-open-btn{flex:0 0 auto;padding:14px 18px;font-size:22px;border:1px solid var(--b2);border-radius:var(--r2);background:var(--glass-strong);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:var(--glass-blur)}
.scan-open-btn:active{background:var(--acc-light);border-color:var(--acc)}
/* Scanare AWB/produs din cameră — cerut direct: „un sistem prin care să se deschidă camera și să
   scaneze AWB-ul, iar prin scan să se recomande comanda și produsul de împachetat". Overlay separat de
   .sheet (nu bottom-sheet) — video-ul are nevoie de tot ecranul, nu de un card la 85dvh. */
.scan-overlay{position:fixed;inset:0;background:#000;z-index:260;display:none;flex-direction:column}
.scan-overlay.on{display:flex}
.scan-video{flex:1;width:100%;object-fit:cover;background:#000}
.scan-frame{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:78vw;max-width:420px;height:200px;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none}
.scan-top-bar{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;display:flex;justify-content:flex-end;z-index:1}
.scan-close-btn{padding:10px 16px;border-radius:999px;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:19px;font-weight:700}

<script>
const SUPA_URL='https://cbpavtvrfpkbaeueexlw.supabase.co';
const SUPA_KEY='sb_publishable_m7_oRHyxmrrvuGpudY9V1g_LM85ubbr';
async function sb(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  // Fără timeout, o cerere pe o conexiune căzută/instabilă (WiFi de depozit, tabletă ieșită din sleep)
  // putea rămâne agățată la infinit, fără eroare — ecranul rămânea blocat. La 20s fără răspuns, se
  // anulează explicit, ca restul aplicației (deja pregătită cu try/catch) să poată reacționa normal.
  const ctrl=new AbortController();
  const timeoutId=setTimeout(()=>ctrl.abort(),20000);
  opts.signal=ctrl.signal;
  let r;
  try{
    r=await fetch(SUPA_URL+'/rest/v1/'+path,opts);
  }catch(e){
    if(e.name==='AbortError')throw new Error('Conexiune Supabase blocată (fără răspuns 20s) — verifică internetul');
    throw e;
  }finally{
    clearTimeout(timeoutId);
  }
  const d=await r.json();
  if(!r.ok)throw new Error(JSON.stringify(d));
  return d;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imgSrc(url){if(!url)return'';if(url.startsWith('data:'))return url;if(url.startsWith(SUPA_URL))return url;if(url.startsWith('http'))return'/api/img-proxy?url='+encodeURIComponent(url);return url;}
// Ultimele 4 cifre cu accent — cerut direct, ca staff-ul să distingă rapid coletele când AWB-urile
// se aseamănă la prima vedere (majoritatea au același prefix de curier/platformă).
// Cerut direct: numele curierului (Sameday/DPD/FAN Courier/GLS/Cargus…) afișat înaintea numărului, ca
// să nu mai trebuiască dedus din primele cifre ale AWB-ului. Gol pe comenzi vechi/asociate manual,
// unde curierul nu a fost reținut — eticheta rămâne „AWB", ca înainte.
function awbBoxHtml(awb,courier){
  if(!awb)return'';
  const s=esc(awb),head=s.slice(0,-4),tail=s.slice(-4);
  const lbl=courier?`${esc(courier)} · AWB`:'AWB';
  return`<div class="awb-box"><div><div class="awb-lbl">${lbl}</div><div class="awb-num">${head}<span class="awb-num-tail">${tail}</span></div></div></div>`;
}

let PRODUSE=[],COMENZI=[],JURNAL=[],ORDERS=[],PREPACK=[],STAFFMSG=[],FURNIZOR=[],curKey=null,activeTab='pack',activeImg={},stockCardIdx=0,stockSaveBusy=false,stockSwipeX=null;
let sheetCtx=null; // {lk} sau {lk,type:'stoc_redus'} — comanda/linia pentru care e deschis sheet-ul de probleme

const STAFF_NAME_KEY='sm6_staff_name';
let staffName='';
try{staffName=localStorage.getItem(STAFF_NAME_KEY)||'';}catch(e){}
const STAFF_UPDATE_KEY='sm6_staff_seen_update';
const STAFF_UPDATES=[
  {n:413,date:'23.09.2026',text:'Cardul de comandă arată acum numele curierului (Sameday/DPD/FAN Courier/GLS/Cargus…) direct înaintea numărului AWB, nu doar codul brut — cerut direct. Curierul se reține automat la asociere, din formatul etichetei; pe comenzi vechi, asociate înainte de această modificare, rămâne doar „AWB", fără curier.'},
  {n:412,date:'23.09.2026',text:'Flux Staff simplificat: toate produsele unei comenzi rămân împreună în același card, iar o singură acțiune finalizează coletul. Cu AWB deja asociat devine complet; fără AWB este finalizat și poate fi completat ulterior din PDF. După confirmare ai 10 secunde pentru anulare, apoi se trece la următoarea comandă. Reîncărcarea este numai manuală, ca ecranul să nu se schimbe în timp ce lucrezi.'},
  {n:412,date:'21.09.2026',text:'Reset automat zilnic al cozii — pragul mutat de la ora 16:00 la ora 22:00, cerut direct. Aceeași logică (o singură dată pe zi, verificată la pornire și la fiecare reîmprospătare din poll), doar ora s-a schimbat.'},
  {n:411,date:'19.09.2026',text:'Bug real reparat, raportat direct: scanul (📷) recunoștea codul de bare, dar nu-l asocia cu comanda, deși AWB-ul exista deja la noi. Cauza, verificată decodificând etichete reale (Sameday, FAN Courier, DPD): codul de bare fizic conține AWB-ul ca PARTE dintr-un cod mai lung (ex. FAN Courier adaugă un sufix intern după AWB), nu identic cu el — verificarea veche funcționa doar când codul scanat era mai scurt sau egal cu AWB-ul salvat. Acum se verifică ambele direcții.'},
  {n:410,date:'19.09.2026',text:'„↺ Coadă nouă" pornește acum și automat, o singură dată pe zi, la ora 16:00 — cerut direct. Aceeași acțiune ca butonul manual (comenzile rămân în ERP/jurnal/istoric, doar dispar din coada activă Staff), dar fără confirmare, ca să pregătească singură platforma pentru ziua următoare. Verifică la deschiderea tabletei și la fiecare reîmprospătare — dacă tableta rămâne deschisă peste ora 16, sau e pornită abia după aceea.'},
  {n:409,date:'18.09.2026',text:'La „🔍 Căutare" — buton nou „📷" lângă căutarea text: deschide camera și scanează codul de bare al AWB-ului sau al produsului. Un singur rezultat → sari direct la comanda de împachetat; mai multe → alegi din listă, la fel ca la căutarea manuală. Codul scanat completează exact același câmp de căutare, deci funcționează cu tot ce funcționa deja (comandă, client, AWB, SKU, cod intern) plus, nou, EAN-ul (codul de bare fizic al produsului).'},
  {n:408,date:'18.09.2026',text:'Tab nou „📥 Marfă furnizor" — separat de „De rezolvat", nu-l înlocuiește. Aici apar comenzile plasate la furnizor, încă pe drum (adăugate de admin din Inventar/Dashboard). Pe fiecare produs: „✗ Nu a ajuns" sau „◐ A ajuns parțial" (cu cantitatea primită), plus „✓ Tot restul a ajuns" jos, pentru tot ce-a rămas din comandă. Nu atinge stocul din Manager Stoc — doar urmărește sosirea.'},

const LOCK_TTL_MIN=15;
let lockHeartbeatTimer=null,lockHeartbeatKey=null;

function findProdus(id){return id?PRODUSE.find(p=>p.id===id):null;}

function computeOrders(){
  const groups={};
  COMENZI.forEach(o=>{
    // Numărul unei comenzi nu este global unic între marketplace-uri. Fără platformă în cheie,
    // o comandă eMAG și una Trendyol cu același ID se puteau împacheta ca un singur colet.
    const key=o.comanda_id?`platforma:${o.platforma||'necunoscut'}:${o.comanda_id}`:('_row'+o.id);
    if(!groups[key])groups[key]={key,comandaId:o.comanda_id||'',platforma:o.platforma,clientNume:o.client_nume||'',data:o.data,sortAt:o.created_at||o.data,lines:[]};
    o._table='platforma_comenzi';
    groups[key].lines.push(o);
    if(String(o.created_at||o.data)<String(groups[key].sortAt))groups[key].sortAt=o.created_at||o.data;
  });

  // Comenzile eMAG/Trendyol se scriu automat și în Jurnal la import (ca să existe evidența zilnică
  // corectă acolo) — ca să nu apară de 2 ori în coadă, scădem din fiecare rând de Jurnal cantitatea
  // deja acoperită de o comandă de platformă pentru același produs, în aceeași zi. Ce rămâne peste
  // (dacă rămâne) chiar a fost o vânzare directă ("Extra").
  const coveredByPlatform={};
  COMENZI.forEach(o=>{
    const day=String(o.created_at||o.data).slice(0,10);
    const k=o.produs_id+'|'+day;
    coveredByPlatform[k]=(coveredByPlatform[k]||0)+(Number(o.cantitate)||0);
  });
  JURNAL.forEach(j=>{
    const day=String(j.data).slice(0,10);
    const k=j.product_id+'|'+day;
    const remaining=(Number(j.qty)||0)-(coveredByPlatform[k]||0);
    if(remaining<=0)return;
    const line={id:j.id,produs_id:j.product_id,produs_nume:j.product_name,cantitate:remaining,pnk:'',awb:'',
      impachetat:!!j.impachetat,impachetat_at:j.impachetat_at||'',fara_stoc:!!j.fara_stoc,
      staff_blocked:!!j.staff_blocked,staff_blocked_at:j.staff_blocked_at||'',staff_issue_type:j.staff_issue_type||'',
      staff_issue_note:j.staff_issue_note||'',staff_issue_resolved:!!j.staff_issue_resolved,_table:'jurnal'};
    groups['j'+j.id]={key:'j'+j.id,comandaId:'',platforma:'direct',clientNume:'',data:j.data,sortAt:j.created_at||j.data,lines:[line]};
  });

  ORDERS=Object.values(groups).sort((a,b)=>String(a.sortAt).localeCompare(String(b.sortAt))||a.key.localeCompare(b.key));
  ORDERS.forEach(g=>{
    g.allDone=g.lines.every(l=>l.impachetat||l.staff_blocked);
    g.hasUnresolvedIssue=g.lines.some(l=>l.staff_blocked&&!l.staff_issue_resolved);
    g.awb=(g.lines.find(l=>l.awb)||{}).awb||'';
    // Cerut direct — numele curierului (Sameday/DPD/FAN Courier/GLS/Cargus) afișat pe card, înainte de
    // AWB, ca să nu mai trebuiască dedus din primele cifre. Reținut la asociere (vezi awb_courier din
    // index.html); gol pe comenzi vechi, asociate înainte de această coloană.
    g.awbCourier=(g.lines.find(l=>l.awb_courier)||{}).awb_courier||'';
    // Staff finalizează coletul ca întreg. Dacă eticheta nu a fost încă generată, comanda iese tot
    // din fluxul de împachetare ca „Finalizat fără AWB”; la importul ulterior din PDF devine completă.
    g.needsAwb=g.platforma!=='direct'&&!g.awb;
    g.finalized=g.allDone&&!g.hasUnresolvedIssue;
    g.finalizedWithoutAwb=g.finalized&&g.needsAwb;
    g.complete=g.finalized&&!g.needsAwb;
    g.waiting=g.hasUnresolvedIssue;
    const lastPackedAt=g.lines.map(l=>l.impachetat_at).filter(Boolean).sort().slice(-1)[0]||'';
    g.finalizedToday=g.finalized&&lastPackedAt.slice(0,10)===td();
  });
}
// Pragul salvat la „Coada nouă” este fluxul real: toate comenzile introduse în ERP după acel moment
// trebuie pregătite, indiferent de ziua în care clientul le-a plasat pe marketplace.
function packQueue(){return ORDERS.filter(o=>!o.finalized&&!o.waiting);}
function waitingQueue(){return ORDERS.filter(o=>o.waiting);}
// listă completă (inclusiv comenzi deja împachetate) pt. navigare Anterioară/Următoare —
// packQueue() se golește pe măsură ce lucrezi, așa că butonul "Anterioară" ar rămâne mereu
// dezactivat dacă ar naviga tot peste packQueue (nu mai există "înainte" în coada care se micșorează)
function navQueue(){return ORDERS.filter(o=>!o.waiting);}
function finalizedTodayQueue(){return ORDERS.filter(o=>o.finalizedToday).sort((a,b)=>{
  const at=a=>a.lines.map(l=>l.impachetat_at).filter(Boolean).sort().slice(-1)[0]||'';
  return at(b).localeCompare(at(a));
});}
function currentOrder(){return ORDERS.find(o=>o.key===curKey)||null;}

function pickInitialOrder(list){curKey=list.length?list[0].key:null;}

function showToast(msg,undoFn){
  const t=document.getElementById('toast');
  t.innerHTML=esc(msg)+(undoFn?'<button class="toast-undo" id="toast-undo-btn">ANULEAZĂ · <span id="toast-undo-sec">10</span>s</button>':'');
  t.classList.add('on');
  if(undoFn)document.getElementById('toast-undo-btn').onclick=()=>{undoFn();hideToast();};
  clearTimeout(showToast._t);
  if(!undoFn)showToast._t=setTimeout(hideToast,1800);
}
function hideToast(){document.getElementById('toast').classList.remove('on');}

function renderProgress(){
  const total=ORDERS.length;
  const done=ORDERS.filter(o=>o.finalized).length;
  const remaining=total-done;
  document.getElementById('progress-txt').textContent=total?`${remaining} comenzi`:'Nicio comandă';
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('progress-fill').style.width=pct+'%';
  document.getElementById('progress-pct').textContent=`${done} / ${total} (${pct}%)`;
  const wc=waitingQueue().length;
  const badge=document.getElementById('waiting-badge');
  if(wc){badge.style.display='inline-block';badge.textContent=wc;}else{badge.style.display='none';}
  const pc=prepackEligibleLines().length;
  const pbadge=document.getElementById('prepack-badge');
  if(pbadge){if(pc){pbadge.style.display='inline-block';pbadge.textContent=pc;}else{pbadge.style.display='none';}}
  const fc=furnizorActiveOrders().length;
  const fbadge=document.getElementById('furnizor-badge');
  if(fbadge){if(fc){fbadge.style.display='inline-block';fbadge.textContent=fc;}else{fbadge.style.display='none';}}
}

function setTab(tab){
  activeTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('on',b.dataset.tab===tab));
  if(tab==='pack'){const q=packQueue();if(!q.some(o=>o.key===curKey))pickInitialOrder(q);}
  if(tab==='waiting'){const q=waitingQueue();if(!q.some(o=>o.key===curKey))pickInitialOrder(q);}
  renderMain(true);
}

function lineKey(l){return l._table+'_'+l.id;}
function findLineByKey(lk){return ORDERS.flatMap(o=>o.lines).find(l=>lineKey(l)===lk)||null;}
function orderOfLine(l){return ORDERS.find(o=>o.lines.includes(l));}

function lineImgList(l){
  const p=findProdus(l.produs_id);
  if(!p)return[];
  const list=[];
  if(p.img)list.push(p.img);
  (p.images||[]).forEach(u=>{if(u&&!list.includes(u))list.push(u);});
  return list;
}

let lastLockedKey=undefined; // undefined != null, ca primul render (curKey posibil null) să nu fie ignorat
function renderMain(resetScroll=false){
  const host=document.getElementById('main-area');
  const searchDock=document.getElementById('search-dock');
  document.querySelector('.wrap').dataset.tab=activeTab;
  const oldScroll=resetScroll?0:host.scrollTop;
  if(activeTab!=='search')searchDock.innerHTML='';
  renderProgress();
  if(curKey!==lastLockedKey){
    lastLockedKey=curKey;
    if(curKey)claimOrderLock(curKey);else stopLockHeartbeat();
  }
  if(activeTab==='pack')renderPackTab(host);
  else if(activeTab==='waiting')renderWaitingTab(host);
  else if(activeTab==='finalized')renderFinalizedTab(host);
  else if(activeTab==='search')renderSearchTab(host);
  else if(activeTab==='stock')renderStockTab(host);
  else if(activeTab==='prepack')renderPrepackTab(host);
  else if(activeTab==='furnizor')renderFurnizorTab(host);
  // Pollingul înlocuiește doar conținutul intern. Restabilim poziția după paint, ca Safari să nu
  // trimită angajatul la începutul comenzii în timp ce verifică produsele.
  requestAnimationFrame(()=>{if(!resetScroll&&document.activeElement?.matches('input,textarea,select'))return;host.scrollTop=oldScroll;});
}

function lineThumbHtml(l){
  const imgs=lineImgList(l);
  const lk=lineKey(l);
  const activeUrl=activeImg[lk]||imgs[0]||'';
  const imgHtml=activeUrl
    ?`<img class="line-img" src="${esc(imgSrc(activeUrl))}" onerror="this.style.display='none'" onclick="cycleLineImg('${lk}')">`
    :`<div class="line-img-ph">📦</div>`;
  const thumbsHtml=imgs.length>1?`<div class="line-thumbs">${imgs.map(u=>`<img class="line-thumb ${u===activeUrl?'active':''}" src="${esc(imgSrc(u))}" onclick="activeImg['${lk}']='${esc(u)}';renderMain()">`).join('')}</div>`:'';
  return`<div class="line-img-wrap">${imgHtml}${thumbsHtml}</div>`;
}

function lineInfoHtml(l,showCheck){
  const p=findProdus(l.produs_id);
  const lk=lineKey(l);
  const issueHtml=l.staff_blocked?`<div class="line-issue">⛔ ${esc(ISSUE_LABELS[l.staff_issue_type]||'Problemă raportată')}</div>`:'';
  const resolveHtml=l.staff_blocked?`<button type="button" class="line-check" ${lineBusy[lk]?'disabled':''} onclick="resolveIssue('${lk}')">✓ Problemă rezolvată</button>`:'';
  const checkHtml=showCheck?`<button type="button" class="line-check ${l.impachetat?'on':''}" ${lineBusy[lk]?'disabled':''} onclick="toggleLineCheck('${lk}')">${l.impachetat?'✓ Confirmat':'Confirmă produs'}</button>`:'';
  const stock=p?(Number(p.bought)||0)-(Number(p.sold)||0):null;
  const stockCls=stock===null?'':stock<=0?'zero':stock<Number(l.cantitate)?'low':'';
  const stockHtml=stock===null?'':`<div class="line-stock-box"><div class="line-qty-lbl">Stoc ERP</div><div class="line-stock ${stockCls}">${stock} BUC.</div></div>`;
  return`<div class="line-info">
    <div class="line-nm">${esc(l.produs_nume||l.titlu_extern||'Produs necunoscut')}</div>
    <div class="line-meta">${p&&p.internalCode?'Cod intern '+esc(p.internalCode)+' · ':''}${p&&p.sku?'SKU '+esc(p.sku):''}</div>
    <div class="line-qty-row">
      <div class="line-qty-box"><div class="line-qty-lbl">Cantitate în comandă</div><div class="line-qty">${l.cantitate} BUC.</div></div>
      ${stockHtml}
    </div>
    ${issueHtml}${resolveHtml}${checkHtml}
  </div>`;
}

function renderPackTab(host){
  const q=packQueue();
  if(!q.length){
    host.innerHTML=`<div class="empty"><div class="big">🎉</div><div>Nicio comandă de împachetat momentan.</div></div>`;
    return;
  }
  const nq=navQueue();
  if(!currentOrder()||!nq.some(o=>o.key===curKey)){curKey=q[0].key;}
  const ord=currentOrder();
  const idx=nq.findIndex(o=>o.key===ord.key);
  const plLabel=ord.platforma==='emag'?'eMAG':ord.platforma==='trendyol'?'Trendyol':ord.platforma==='vinted'?'Vinted':'Extra';
  const multi=ord.lines.length>1;
  const linesHtml=ord.lines.map(l=>{
    const state=l.impachetat?'done':(l.staff_blocked?'blocked':'');
    return`<div class="line ${state}">${lineThumbHtml(l)}${lineInfoHtml(l,false)}</div>`;
  }).join('');
  const bigBtnHtml=`<button type="button" class="big-pack-btn" ${lineBusy['order_'+ord.key]?'disabled':''} onclick="finalizeOrder('${ord.key}')">${ord.awb?'✓ Finalizează coletul':'✓ Marchează finalizat'}</button>`;
  host.innerHTML=`<div class="card ${multi?'multi-line':'single-line'}">
    <div class="ord-hdr">
      <div class="ord-hdr-row1">
        <span class="ord-pl ${ord.platforma}">${plLabel}</span>
        ${ord.comandaId?`<span class="ord-num">#${esc(ord.comandaId)}</span>`:''}
        <span class="ord-date">${esc(ord.data||'')}</span>
      </div>
      ${ord.clientNume?`<div class="ord-client">${esc(ord.clientNume)}</div>`:''}
    </div>
    <div id="lock-banner-slot"></div>
    ${ord.awb?awbBoxHtml(ord.awb,ord.awbCourier):(ord.platforma!=='direct'?`<div class="awb-box"><span class="awb-pending">AWB în așteptare</span></div>`:'')}
    ${multi?`<div class="progress-mini">${ord.lines.length} produse în același colet</div>`:''}
    <div class="lines">${linesHtml}</div>
    ${bigBtnHtml}
    <div class="nav-row">
      <button class="nav-btn" onclick="navStep(-1)" ${idx<=0?'disabled':''}>◀ Anterioară</button>
      <button type="button" class="report-btn" onclick="openReportSheet('${ord.key}')">⚠ Raportează problemă</button>
      <button class="nav-btn" onclick="navStep(1)" ${idx<0||idx>=nq.length-1?'disabled':''}>Următoare ▶</button>
    </div>
    <div style="text-align:center;color:var(--t3);font-size:16px">Comanda ${idx+1} din ${nq.length}</div>
  </div>`;
}

function navStep(dir){
  const q=navQueue();
  const idx=q.findIndex(o=>o.key===curKey);
  const ni=idx+dir;
  if(ni<0||ni>=q.length)return;
  curKey=q[ni].key;
  renderMain(true);
}

function cycleLineImg(lk){
  const imgs=lineImgList(findLineByKey(lk)||{});
  if(imgs.length<2)return;
  const cur=activeImg[lk]||imgs[0];
  const idx=(imgs.indexOf(cur)+1)%imgs.length;
  activeImg[lk]=imgs[idx];
  renderMain();
}

function showLockBanner(name,ageMin){
  const el=document.getElementById('lock-banner-slot');if(!el)return;
  const ago=ageMin<1?'chiar acum':`acum ${Math.round(ageMin)} min`;
  el.innerHTML=`<div class="lock-banner">👀 <b>${esc(name)}</b> lucrează la asta (${esc(ago)}) — poți continua oricând</div>`;
}
function hideLockBanner(){
  const el=document.getElementById('lock-banner-slot');if(el)el.innerHTML='';
}
function orderLockTarget(ord){
  // O comandă de platformă = mai multe rânduri (comanda_id+platforma) — blocarea trebuie scrisă/citită
  // pe TOATE deodată (un singur PATCH), nu per linie, altfel două tablete pot "despărți" lock-ul pe o
  // comandă cu produse multiple. Comenzile directe (jurnal) sunt deja un singur rând.
  const l=ord.lines[0];
  if(l._table==='platforma_comenzi'&&ord.comandaId)return{table:'platforma_comenzi',filter:`comanda_id=eq.${encodeURIComponent(ord.comandaId)}&platforma=eq.${ord.platforma}`};
  return{table:l._table,filter:`id=eq.${l.id}`};
}
async function claimOrderLock(orderKey){
  const ord=ORDERS.find(o=>o.key===orderKey);
  if(!ord||!ord.lines.length){hideLockBanner();return;}
  const target=orderLockTarget(ord);
  let freshRows=[];
  try{
    freshRows=await sb('GET',`${target.table}?${target.filter}&select=staff_lock_by,staff_lock_at`);
  }catch(e){console.warn('lock check:',e);}
  const holder=freshRows.find(r=>r.staff_lock_by&&r.staff_lock_at);
  if(holder&&holder.staff_lock_by!==staffName){
    const ageMin=(Date.now()-new Date(holder.staff_lock_at).getTime())/60000;
    if(ageMin<LOCK_TTL_MIN)showLockBanner(holder.staff_lock_by,ageMin);else hideLockBanner();
  }else{
    hideLockBanner();
  }
  if(!staffName){stopLockHeartbeat();return;} // fără nume, doar avertismentul de mai sus — nu scriem un lock gol
  if(curKey!==orderKey)return; // navigare rapidă — nu mai scrie peste o comandă deja părăsită
  try{
    await sb('PATCH',`${target.table}?${target.filter}`,{staff_lock_by:staffName,staff_lock_at:new Date().toISOString()});
  }catch(e){console.warn('lock claim:',e);}
  startLockHeartbeat(orderKey);
}
function startLockHeartbeat(orderKey){
  if(lockHeartbeatTimer&&lockHeartbeatKey===orderKey)return;
  stopLockHeartbeat();
  lockHeartbeatKey=orderKey;
  lockHeartbeatTimer=setInterval(()=>{
    if(curKey!==orderKey||!staffName){stopLockHeartbeat();return;}
    const ord=ORDERS.find(o=>o.key===orderKey);if(!ord)return;
    const target=orderLockTarget(ord);
    sb('PATCH',`${target.table}?${target.filter}`,{staff_lock_at:new Date().toISOString()}).catch(()=>{});
  },60000);
}
function stopLockHeartbeat(){
  clearInterval(lockHeartbeatTimer);lockHeartbeatTimer=null;lockHeartbeatKey=null;
}

// ── PRE-ÎMPACHETARE (coduri generate din index.html → Inventar → 🏷️ Pre-împachetează) ──
// Verificare pur locală (PREPACK, reîmprospătat la fiecare 25s ca restul comenzilor) — dacă există
// destule coduri nefolosite pentru produsul liniei ca să acopere TOATĂ cantitatea cerută pe linia
// asta, arătăm „deja împachetat" în loc de pașii normali. Per LINIE (produs), nu per comandă întreagă
// — o comandă cu mai multe produse diferite poate arăta mixt (o linie gata, alta de împachetat normal).
function linePrepackCodes(l){
  if(l.impachetat)return[];
  return PREPACK.filter(c=>c.produs_id===l.produs_id);
}
function linePrepackReady(l){return linePrepackCodes(l).length>=(Number(l.cantitate)||0);}
async function confirmPrepacked(lk){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l)return;
  const codes=linePrepackCodes(l).slice(0,Number(l.cantitate)||0);
  if(codes.length<(Number(l.cantitate)||0)){
    showToast('Codurile nu mai sunt disponibile — reîmprospătez');
    await refreshData();
    return;
  }
  lineBusy[lk]=true;renderMain();
  const ord=orderOfLine(l);
  try{
    await sb('PATCH',`pre_impachetate?id=in.(${codes.map(c=>c.id).join(',')})`,{folosit_la:new Date().toISOString(),comanda_key:ord?.key||null});
    const usedIds=new Set(codes.map(c=>c.id));
    PREPACK=PREPACK.filter(c=>!usedIds.has(c.id));
    await patchLine(l,{impachetat:true,impachetat_at:new Date().toISOString()});
    logActivity('impachetat_prepacked',l,codes.map(c=>c.cod).join(','));
    computeOrders();
  }catch(e){
    showToast('Eroare la confirmare — încearcă din nou');
    console.error(e);
  }
  lineBusy[lk]=false;
  renderMain();
}
// Tab dedicat „🏷️ Pre-împachetate" — cerut explicit ca ecran SEPARAT de fluxul normal „Împachetare"
// (nu ca buton/culoare specială pe cardul obișnuit): o listă plată, peste toate comenzile active,
// cu fiecare linie care are deja cod disponibil. Odată confirmată de aici, linia devine „impachetat=true"
// exact ca o bifare manuală — dispare din lista asta și, în „Împachetare", arată identic cu orice
// altă linie bifată manual, fără nicio distincție vizuală.
function prepackEligibleLines(){
  const out=[];
  ORDERS.forEach(o=>{
    if(o.finalized)return;
    o.lines.forEach(l=>{if(!l.impachetat&&linePrepackReady(l))out.push({line:l,order:o});});
  });
  return out;
}
function renderPrepackTab(host){
  const items=prepackEligibleLines();
  if(!items.length){host.innerHTML=`<div class="empty"><div class="big">🏷️</div><div>Nicio linie cu cod pre-împachetat disponibil acum.</div></div>`;return;}
  host.innerHTML=`<div class="search-page-list">${items.map(({line:l,order:o})=>{
    const p=findProdus(l.produs_id);
    const lk=lineKey(l);
    const codes=linePrepackCodes(l);
    const img=p&&p.img?`<img class="list-item-th" src="${esc(imgSrc(p.img))}" onerror="this.style.display='none'">`:`<div class="list-item-th-ph">📦</div>`;
    const plLabel=o.platforma==='emag'?'eMAG':o.platforma==='trendyol'?'Trendyol':o.platforma==='vinted'?'Vinted':'Extra';
    return`<div class="list-item" style="cursor:default">
      ${img}
      <div class="list-item-main">
        <div class="list-item-nm">${esc(l.produs_nume||p?.name||'')}</div>
        <div class="list-item-meta">${plLabel}${o.comandaId?' · #'+esc(o.comandaId):''} · ${l.cantitate} buc · cod ${esc(codes[0]?.cod||'')}</div>
      </div>
      <button type="button" class="line-check prepacked" style="align-self:center" ${lineBusy[lk]?'disabled':''} onclick="confirmPrepacked('${lk}')">Confirmă</button>
    </div>`;
  }).join('')}</div>`;
}

/* ── Marfă furnizor — comenzi plasate la furnizor, încă pe drum (SEPARAT de stocul intern: nu se
   atinge nimic din produse/stoc aici, doar se urmărește ce a ajuns fizic) ── */
function computeFurnizorOrders(){
  const groups={};
  FURNIZOR.forEach(r=>{
    const key=(r.furnizor||'—')+'|'+(r.comanda_ref||('_row'+r.id));
    if(!groups[key])groups[key]={key,furnizor:r.furnizor||'',comandaRef:r.comanda_ref||'',sortAt:r.created_at,lines:[]};
    groups[key].lines.push(r);
    if(String(r.created_at)<String(groups[key].sortAt))groups[key].sortAt=r.created_at;
  });
  return Object.values(groups).sort((a,b)=>String(b.sortAt).localeCompare(String(a.sortAt)));
}
// Comenzile din FURNIZOR sunt deja filtrate finalizat=false la citire — un grup cu toate liniile
// finalizate între timp local (după o acțiune) dispare corect din activ fără să mai ceară un refresh.
function furnizorActiveOrders(){
  return computeFurnizorOrders().map(g=>({...g,lines:g.lines.filter(l=>!l.finalizat)})).filter(g=>g.lines.length>0);
}
function furnizorLineHtml(r){
  const p=findProdus(r.produs_id);
  const lk='cf_'+r.id;
  const busy=lineBusy[lk];
  const img=p&&p.img?`<img class="list-item-th" src="${esc(imgSrc(p.img))}" onerror="this.style.display='none'">`:`<div class="list-item-th-ph">📦</div>`;
  const restul=Math.max(0,(Number(r.cantitate_comandata)||0)-(Number(r.cantitate_sosita)||0));
  const issueHtml=(r.nu_a_sosit&&!r.nu_a_sosit_rezolvat)?`<div class="list-item-issue">⛔ Nu a ajuns${r.nu_a_sosit_nota?': '+esc(r.nu_a_sosit_nota):''}</div>`:'';
  return`<div class="cf-line">
    <div class="cf-line-top">
      ${img}
      <div class="list-item-main">
        <div class="list-item-nm">${esc(p?p.name:r.titlu_extern)}</div>
        <div class="list-item-meta">${r.cod_extern?'Cod '+esc(r.cod_extern)+' · ':''}comandat ${fmtCfQty(r.cantitate_comandata)}${r.cantitate_sosita>0?` · sosit ${fmtCfQty(r.cantitate_sosita)} · rest ${fmtCfQty(restul)}`:''}</div>
        ${issueHtml}
      </div>
    </div>
    <div class="cf-line-actions">
      <input type="number" class="cf-qty-input" id="cf-qty-${r.id}" min="0" step="0.5" placeholder="buc." ${busy?'disabled':''}>
      <button type="button" class="line-check" ${busy?'disabled':''} onclick="furnizorReportSosire(${r.id})">◐ A ajuns</button>
      <button type="button" class="report-btn" ${busy?'disabled':''} onclick="furnizorReportNuASosit(${r.id})">✗ Nu a ajuns</button>
    </div>
  </div>`;
}
function fmtCfQty(v){const n=Number(v)||0;return Number.isInteger(n)?String(n):n.toFixed(1);}
function renderFurnizorTab(host){
  const orders=furnizorActiveOrders();
  if(!orders.length){host.innerHTML=`<div class="empty"><div class="big">📥</div><div>Nicio comandă de la furnizor în așteptare.</div></div>`;return;}
  host.innerHTML=`<div class="search-page-list">${orders.map(g=>`<div class="cf-order">
    <div class="ord-hdr"><span class="ord-num">${esc(g.furnizor||'Furnizor')}</span>${g.comandaRef?`<span class="list-item-meta">#${esc(g.comandaRef)}</span>`:''}</div>
    ${g.lines.map(furnizorLineHtml).join('')}
    <button type="button" class="nav-btn" data-key="${esc(g.key)}" onclick="furnizorFinalizeazaRestul(this.dataset.key)">✓ Tot restul a ajuns</button>
  </div>`).join('')}</div>`;
}
async function furnizorReportNuASosit(id){
  const lk='cf_'+id;if(lineBusy[lk])return;
  const nota=prompt('Notă (opțional) — ce s-a întâmplat, cine a confirmat etc.:');
  if(nota===null)return;
  lineBusy[lk]=true;renderMain();
  try{
    const body={nu_a_sosit:true,nu_a_sosit_at:new Date().toISOString(),nu_a_sosit_nota:nota||null,nu_a_sosit_rezolvat:false};
    await sb('PATCH',`comenzi_furnizor?id=eq.${id}`,body);
    const r=FURNIZOR.find(x=>x.id===id);if(r)Object.assign(r,body);
    logActivity('marfa_nu_a_sosit',{_table:'comenzi_furnizor',id},nota||null);
    showToast('⛔ Marcat „nu a ajuns” — apare și în clopoțelul din admin');
  }catch(e){showToast('Eroare — încearcă din nou');console.error(e);}
  lineBusy[lk]=false;renderMain();
}
// Cantitatea introdusă se ADUNĂ la ce era deja sosit (nu înlocuiește) — o comandă poate ajunge în
// mai multe tranșe, fiecare raportare adaugă ce a venit ACUM, nu totalul cumulat din cap.
async function furnizorReportSosire(id){
  const lk='cf_'+id;if(lineBusy[lk])return;
  const r=FURNIZOR.find(x=>x.id===id);if(!r)return;
  const inp=document.getElementById('cf-qty-'+id);
  const add=Number(inp?.value);
  if(!add||add<=0){showToast('Introdu o cantitate validă');return;}
  lineBusy[lk]=true;renderMain();
  try{
    const sosita=(Number(r.cantitate_sosita)||0)+add;
    const finalizat=sosita>=(Number(r.cantitate_comandata)||0);
    const body={cantitate_sosita:sosita,finalizat,finalizat_at:finalizat?new Date().toISOString():null,
      // Marfa a ajuns — orice raportare anterioară de „nu a ajuns” pe aceeași linie e depășită de fapte.
      nu_a_sosit:false,nu_a_sosit_rezolvat:true};
    await sb('PATCH',`comenzi_furnizor?id=eq.${id}`,body);
    Object.assign(r,body);
    logActivity('marfa_sosita',{_table:'comenzi_furnizor',id},String(add));
    showToast(finalizat?'✓ Produs complet — linie închisă':`✓ +${fmtCfQty(add)} buc. înregistrate`);
  }catch(e){showToast('Eroare — încearcă din nou');console.error(e);}
  lineBusy[lk]=false;renderMain();
}
// „Tot restul a ajuns” NU atinge liniile cu o problemă nerezolvată („nu a ajuns”) — ar contrazice
// tăcut un raport real; acelea rămân active până se rezolvă explicit, prin „A ajuns” sau din admin.
async function furnizorFinalizeazaRestul(key){
  const g=furnizorActiveOrders().find(x=>x.key===key);if(!g)return;
  const targets=g.lines.filter(l=>!(l.nu_a_sosit&&!l.nu_a_sosit_rezolvat));
  if(!targets.length){showToast('Nimic de finalizat — toate liniile rămase au o problemă raportată');return;}
  if(!confirm(`Marchezi restul de ${targets.length} produs${targets.length>1?'e':''} ca sosit complet?`))return;
  targets.forEach(l=>lineBusy['cf_'+l.id]=true);renderMain();
  const now=new Date().toISOString();
  try{
    await Promise.all(targets.map(async l=>{
      const body={cantitate_sosita:Number(l.cantitate_comandata)||0,finalizat:true,finalizat_at:now};
      await sb('PATCH',`comenzi_furnizor?id=eq.${l.id}`,body);
      Object.assign(l,body);
    }));
    showToast(`✓ ${targets.length} produs${targets.length>1?'e închise':' închis'}`);
  }catch(e){showToast('Eroare la salvare — încearcă din nou');console.error(e);}
  targets.forEach(l=>lineBusy['cf_'+l.id]=false);renderMain();
}

async function patchLine(l,body){
  await sb('PATCH',`${l._table}?id=eq.${l.id}`,body);
  Object.assign(l,body);
  // liniile din jurnal sunt obiecte SINTETICE, recreate de fiecare computeOrders() din JURNAL —
  // mutația de mai sus pe `l` se pierde la următorul recalcul dacă nu o aplicăm și pe rândul sursă.
  if(l._table==='jurnal'){
    const jr=JURNAL.find(j=>j.id===l.id);
    if(jr){
      const map={impachetat:'impachetat',impachetat_at:'impachetat_at',fara_stoc:'fara_stoc',fara_stoc_at:'fara_stoc_at',
        staff_blocked:'staff_blocked',staff_blocked_at:'staff_blocked_at',staff_issue_type:'staff_issue_type',
        staff_issue_note:'staff_issue_note',staff_issue_resolved:'staff_issue_resolved'};
      Object.keys(body).forEach(k=>{if(map[k])jr[map[k]]=body[k];});
    }
  }
}

// Comandă cu UN singur produs — marele buton ÎMPACHETAT împachetează direct linia și finalizează.
async function packSingleLine(lk,orderKey){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l)return;
  lineBusy[lk]=true;renderMain();
  const prev={impachetat:l.impachetat,impachetat_at:l.impachetat_at};
  try{
    await patchLine(l,{impachetat:true,impachetat_at:new Date().toISOString()});
    logActivity('impachetat',l,null);
    computeOrders();
    lineBusy[lk]=false;
    scheduleUndo(orderKey,[{table:l._table,id:l.id,prev}],'pack');
  }catch(e){
    lineBusy[lk]=false;
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
    renderMain();
  }
}

// Anulare ÎMPACHETAT pt. comenzi cu un singur produs, după ce fereastra de 5s a trecut deja —
// declanșată prin ținere apăsată pe buton (nu un tap simplu, ca să nu se anuleze din greșeală).
let holdTimer=null;
function startHoldUnpack(lk){
  clearTimeout(holdTimer);
  holdTimer=setTimeout(()=>{holdTimer=null;unpackSingleLine(lk);},650);
}
function cancelHoldUnpack(){
  clearTimeout(holdTimer);
  holdTimer=null;
}
async function unpackSingleLine(lk){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l)return;
  lineBusy[lk]=true;renderMain();
  try{
    await patchLine(l,{impachetat:false,impachetat_at:null});
    logActivity('impachetat_anulat',l,null);
    computeOrders();
    showToast('↩️ Împachetare anulată');
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
  }
  lineBusy[lk]=false;
  renderMain();
}

// Comandă cu produse multiple — bifează individual un produs (fără undo la nivel de linie).
async function toggleLineCheck(lk){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l)return;
  lineBusy[lk]=true;renderMain();
  const newVal=!l.impachetat;
  try{
    await patchLine(l,{impachetat:newVal,impachetat_at:newVal?new Date().toISOString():null});
    logActivity(newVal?'produs_confirmat':'produs_neconfirmat',l,null);
    computeOrders();
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
  }
  lineBusy[lk]=false;
  renderMain();
}

// Staff confirmă coletul, nu fiecare produs separat: produsele sunt văzute împreună și pleacă în
// același ambalaj. Un AWB prezent îl face „Complet”; altfel rămâne „Finalizat fără AWB” în Admin.
async function finalizeOrder(orderKey){
  const key='order_'+orderKey;
  if(lineBusy[key])return;
  const ord=ORDERS.find(o=>o.key===orderKey);if(!ord)return;
  lineBusy[key]=true;renderMain();
  const at=new Date().toISOString();
  const changes=ord.lines.map(l=>({table:l._table,id:l.id,prev:{impachetat:l.impachetat,impachetat_at:l.impachetat_at||null,staff_finalizat_at:l.staff_finalizat_at||null}}));
  let saved=false;
  try{
    for(const l of ord.lines){const body={impachetat:true,impachetat_at:at};if(l._table==='platforma_comenzi')body.staff_finalizat_at=at;await patchLine(l,body);}
    logActivity(ord.awb?'comanda_completa':'comanda_finalizata_fara_awb',ord.lines[0],{comandaId:ord.comandaId,awb:ord.awb||null});
    computeOrders();
    saved=true;
    scheduleUndo(orderKey,changes,'pack');
  }catch(e){
    console.error(e);showToast('Eroare la finalizare — încearcă din nou');renderMain();
  }finally{lineBusy[key]=false;if(!saved)renderMain();}
}

function scheduleUndo(orderKey,lineChanges,type){
  if(pendingUndo)clearTimeout(pendingUndo.timeoutId);
  const timeoutId=setTimeout(()=>{pendingUndo=null;hideToast();advanceAfterAction(orderKey);},10000);
  pendingUndo={orderKey,lines:lineChanges,timeoutId,type};
  const msg=type==='pack'?'✓ Comanda a fost împachetată':'⏸ Comandă mutată în „În așteptare"';
  showToast(msg,undoAction);
  computeOrders();
  renderMain();
}

async function undoAction(){
  if(!pendingUndo)return;
  clearTimeout(pendingUndo.timeoutId);
  const {orderKey,lines}=pendingUndo;
  try{
    for(const ch of lines){
      const l=findLineByKey(ch.table+'_'+ch.id);
      // patchLine actualizează și sursa JURNAL pentru liniile sintetice de vânzare directă.
      // Un PATCH direct schimba doar obiectul temporar, iar următorul computeOrders reintroducea
      // starea veche, astfel încât „Anulează” părea că nu funcționează.
      if(l)await patchLine(l,ch.prev);
      else await sb('PATCH',`${ch.table}?id=eq.${ch.id}`,ch.prev);
    }
    logActivity('undo',null,{orderKey});
  }catch(e){console.error(e);}
  pendingUndo=null;
  computeOrders();
  curKey=orderKey;
  renderMain();
}

function advanceAfterAction(fromKey){
  const q=activeTab==='waiting'?waitingQueue():packQueue();
  if(!q.length){curKey=null;renderMain();return;}
  const all=ORDERS;
  const idx=all.findIndex(o=>o.key===fromKey);
  const next=q.find(o=>all.findIndex(x=>x.key===o.key)>idx)||q[0];
  curKey=next.key;
  renderMain();
}

/* ── Raportează problemă (bottom sheet) ── */
function openReportSheet(orderKey){
  const ord=ORDERS.find(o=>o.key===orderKey);if(!ord)return;
  if(ord.lines.length===1){sheetCtx={lk:lineKey(ord.lines[0]),orderKey};return renderReasonSheet();}
  sheetCtx={orderKey};
  renderLinePickSheet();
}
function renderLinePickSheet(){

}

function closeSheet(){document.getElementById('sheet-overlay').classList.remove('on');sheetCtx=null;}

async function submitStockReport(bucket){
  const l=findLineByKey(sheetCtx.lk);
  const orderKey=sheetCtx.orderKey;
  closeSheet();
  if(!l)return;
  try{
    const p=findProdus(l.produs_id);
    await sb('POST','staff_stock_reports',{source_table:l._table,source_id:l.id,product_id:l.produs_id||null,product_name:p?p.name:(l.produs_nume||''),estimated_qty_bucket:bucket,reported_by:null});
    logActivity('stoc_redus_raportat',l,{estimated_qty_bucket:bucket});
    showToast('✓ Alertă de stoc trimisă — comanda continuă normal');
  }catch(e){
    showToast('Eroare la trimitere — încearcă din nou');
    console.error(e);
  }
  curKey=orderKey;
  renderMain();
}

async function submitIssue(type,note){
  const l=findLineByKey(sheetCtx.lk);
  const orderKey=sheetCtx.orderKey;
  closeSheet();
  if(!l)return;
  const prev={staff_blocked:l.staff_blocked,staff_blocked_at:l.staff_blocked_at,staff_issue_type:l.staff_issue_type,staff_issue_note:l.staff_issue_note,staff_issue_resolved:l.staff_issue_resolved,fara_stoc:l.fara_stoc,fara_stoc_at:l.fara_stoc_at};
  const body={staff_blocked:true,staff_blocked_at:new Date().toISOString(),staff_issue_type:type,staff_issue_note:note||null,staff_issue_resolved:false};
  if(type==='stoc_zero'){body.fara_stoc=true;body.fara_stoc_at=body.staff_blocked_at;}
  try{
    await patchLine(l,body);
    logActivity('problema_raportata',l,{type,note:note||null});
    computeOrders();

}

// O problemă trebuie să poată fi închisă explicit după ce a fost rezolvată (produs găsit, stoc adus,
// colet corectat). Altfel comanda rămânea blocată pe termen nelimitat, deși baza avea deja coloana
// staff_issue_resolved. La rezolvare, linia se întoarce în coada normală de împachetat.
async function resolveIssue(lk){
  if(lineBusy[lk])return;
  const l=findLineByKey(lk);if(!l||!l.staff_blocked)return;
  const ord=orderOfLine(l);
  if(!confirm('Confirmi că problema a fost rezolvată și produsul poate fi împachetat?'))return;
  lineBusy[lk]=true;renderMain();
  try{
    await patchLine(l,{staff_blocked:false,staff_issue_resolved:true});
    logActivity('problema_rezolvata',l,{tip:l.staff_issue_type||null});
    computeOrders();
    activeTab='pack';
    curKey=ord?.key||null;
    showToast('✓ Problemă rezolvată — comanda a revenit la împachetare');
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
  }
  lineBusy[lk]=false;
  renderMain();
}

  const readyBadge=stockReady?`<div class="list-item-ready">✓ Stoc disponibil acum — ${stock} buc.</div>`:'';

function timeAgo(iso){
  const diffMin=Math.max(0,Math.round((Date.now()-new Date(iso).getTime())/60000));
  if(diffMin<1)return'acum';
  if(diffMin<60)return diffMin+' min';
  const h=Math.round(diffMin/60);
  if(h<24)return h+' h';
  return Math.round(h/24)+' zile';
}

/* ── Căutare ── */
function matchOrder(o,q){
  const s=q.toLowerCase();
  if((o.comandaId||'').toLowerCase().includes(s))return true;
  if((o.clientNume||'').toLowerCase().includes(s))return true;
  // Bug real găsit pe drum, raportat direct („scanul AWB nu recunoaște, deși AWB-ul există"):
  // codul de bare FIZIC de pe etichetă nu conține mereu exact AWB-ul salvat la noi — verificat direct,
  // decodificând codurile reale de pe 3 etichete diferite (Sameday, FAN Courier, DPD): FAN Courier
  // codifică "7000167148503" + "001F5159" (AWB + sufix intern curier), DPD codifică AWB-ul curat pe UN
  // cod, dar și un cod de rutare mai lung care îl conține ca substring. Verificarea veche
  // (awb.includes(text căutat)) mergea doar când textul căutat era mai scurt SAU egal cu AWB-ul salvat
  // — un cod scanat cu sufix în plus (mai lung) nu putea fi niciodată "conținut" în AWB-ul mai scurt.
  // Acum verificăm ambele direcții: AWB-ul salvat conține textul, SAU textul (scanat) conține AWB-ul.
  const awbL=(o.awb||'').toLowerCase();
  if(awbL&&(awbL.includes(s)||s.includes(awbL)))return true;
  // Bug real găsit pe drum: placeholder-ul căutării promitea deja „...SKU sau cod intern", dar
  // codul intern (internalCode) nu era de fapt verificat — util mai ales acum, la pre-împachetare,
  // ca eticheta tipărită (care arată codul intern) să poată fi găsită manual când nu ai cameră.
  // ean — codul de bare fizic de pe ambalajul produsului (diferit de SKU-ul intern) — verificat aici
  // ca să funcționeze scanarea din cameră (📷 Scanează): cine scanează produsul, nu AWB-ul, trimite
  // exact valoarea EAN ca text de căutare.
  return o.lines.some(l=>{
    const p=findProdus(l.produs_id);
    return(l.produs_nume||l.titlu_extern||'').toLowerCase().includes(s)||(p?.sku||'').toLowerCase().includes(s)||(p?.internalCode||'').toLowerCase().includes(s)||(p?.ean||'').toLowerCase().includes(s);
  });
}

/* ── Scanare AWB/produs din cameră (📷, la Căutare) — cerut direct ── */
// Bibliotecă încărcată doar la nevoie (nimeni nu scanează la fiecare sesiune) — același model ca la
// XLSX/pdf.js din index.html. ZXing decodează 1D (Code128 — AWB-uri) ȘI 2D (QR), fără să depindă de
// BarcodeDetector nativ, care nu e disponibil pe Safari/iPad.
let zxingReader=null,scannerOpen=false,lastScanValue='',lastScanAt=0;
async function ensureZXing(){
  if(window.ZXing)return;
  await new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/@zxing/library@0.23.0/umd/index.min.js';
    s.onload=resolve;s.onerror=()=>reject(new Error('Nu s-a putut încărca scanerul — verifică internetul'));
    document.head.appendChild(s);
  });
}
async function openScanner(){
  if(!navigator.mediaDevices?.getUserMedia){showToast('Camera nu e disponibilă în acest browser');return;}
  const status=document.getElementById('scan-status');
  document.getElementById('scan-overlay').classList.add('on');
  scannerOpen=true;
  if(status)status.textContent='Se pornește camera…';
  try{
    await ensureZXing();
    zxingReader=new ZXing.BrowserMultiFormatReader();
    // Camera din spate, nu cea frontală — pe iPad e ultima din listă la majoritatea modelelor; dacă
    // eticheta lipsește sau nu se poate enumera, se cade pe selecția implicită a bibliotecii.
    let deviceId;
    try{
      const devices=await zxingReader.listVideoInputDevices();
      const back=devices.find(d=>/back|rear|environment|spate/i.test(d.label))||devices[devices.length-1];
      deviceId=back?.deviceId;
    }catch(e){/* selecție implicită */}
    if(status)status.textContent='Îndreaptă camera spre codul de bare (AWB sau produs)';
    await zxingReader.decodeFromVideoDevice(deviceId,'scan-video',(result)=>{
      if(result)handleScanResult(result.getText());
    });
  }catch(e){
    closeScanner();
    showToast('Nu s-a putut porni camera: '+(e.message||e));
  }
}
function closeScanner(){
  scannerOpen=false;
  document.getElementById('scan-overlay').classList.remove('on');
  try{zxingReader?.reset();}catch(e){}
  zxingReader=null;
}
// decodeFromVideoDevice apelează callback-ul pe FIECARE cadru analizat (10+/secundă) — fără debounce,
// același cod citit ținând camera nemișcată pe etichetă ar redeclanșa căutarea de zeci de ori.
function handleScanResult(text){
  const now=Date.now();
  if(text===lastScanValue&&now-lastScanAt<2000)return;
  lastScanValue=text;lastScanAt=now;
  closeScanner();
  const input=document.getElementById('search-page-input');
  if(input){input.value=text;onSearchPageInput();}
  const hits=ORDERS.filter(o=>matchOrder(o,text));
  if(hits.length===1){
    showToast(`Scanat: ${text}`);
    jumpToOrder(hits[0].key);
  }else if(!hits.length){
    showToast(`Niciun rezultat pentru codul scanat (${text})`);
  }else{
    showToast(`Scanat: ${text} — ${hits.length} rezultate, alege din listă`);
  }
}

function staffStockProducts(){return PRODUSE.filter(p=>!p.archived).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'ro'));}
function staffStockQty(p){return Number(p?.bought||0)-Number(p?.sold||0);}
function stockClass(v){return v<=0?'zero':v<=3?'low':'';}
function renderStockTab(host){

  const p=list[stockCardIdx],current=staffStockQty(p),img=p.img?`<img class="stock-product-img" src="${esc(imgSrc(p.img))}" onerror="this.style.display='none'">`:'<div class="stock-product-ph">📦</div>';
  host.innerHTML=`<div class="card stock-card" onpointerdown="startStockSwipe(event)" onpointerup="endStockSwipe(event)">

    <div class="stock-product">${img}<div class="stock-product-info"><div class="stock-product-name">${esc(p.name||'Produs fără nume')}</div><div class="stock-product-meta">${p.sku?'SKU '+esc(p.sku)+' · ':''}${p.internalCode?'Cod '+esc(p.internalCode):'Fără cod intern'}</div><div class="stock-values"><div class="stock-value"><div class="stock-value-lbl">Stoc ERP</div><div class="stock-value-num ${stockClass(current)}">${current} buc.</div></div><div class="stock-value"><div class="stock-value-lbl">Intrate total</div><div class="stock-value-num">${Number(p.bought||0)} buc.</div></div></div></div></div>
    <div class="stock-entry"><input type="text" inputmode="decimal" id="staff-stock-input" placeholder="Stoc fizic numărat" onfocus="openStockEntry()" onblur="closeStockEntry()" onkeydown="if(event.key==='Enter')saveStaffStock()"><button type="button" class="big-pack-btn" ${stockSaveBusy?'disabled':''} onclick="saveStaffStock()">${stockSaveBusy?'Se salvează…':'Salvează stocul'}</button></div>
    <div class="stock-saved" id="staff-stock-saved">Introdu stocul fizic numărat și confirmă.</div>
    <div class="stock-nav-row"><button type="button" class="nav-btn" onclick="stockStep(-1)" ${stockCardIdx===0?'disabled':''}>◀ Anterior</button><button type="button" class="nav-btn" onclick="stockStep(1)" ${stockCardIdx>=list.length-1?'disabled':''}>Următor ▶</button></div>
  </div>`;
}
function stockStep(dir){
  const next=stockCardIdx+dir,limit=staffStockProducts().length;
  if(next<0||next>=limit)return;
  stockCardIdx=next;renderMain(true);
}
function openStockEntry(){
  const wrap=document.querySelector('.wrap');if(!wrap)return;
  wrap.dataset.stockEditing='true';
  // Safari încerca să „ajute” mutând întregul card astfel încât câmpul ajungea sus, cu o zonă
  // mare goală sub el. În starea compactă toate informațiile importante încap deja sus, așa că
  // resetăm doar scroll-ul intern al zonei de conținut, niciodată cadrul paginii.
  requestAnimationFrame(()=>{const host=document.getElementById('main-area');if(host)host.scrollTop=0;pinStaffFrame();});
  setTimeout(pinStaffFrame,80);
  setTimeout(pinStaffFrame,260);
}
function closeStockEntry(){
  setTimeout(()=>{const wrap=document.querySelector('.wrap'),host=document.getElementById('main-area');if(wrap)delete wrap.dataset.stockEditing;if(host)host.scrollTop=0;},120);
}
function pinStaffFrame(){
  // iPad Safari încearcă uneori să deruleze documentul exterior când un input primește focus,
  // chiar dacă body are overflow:hidden. Staff este un ecran de lucru fix: păstrăm mereu originea
  // documentului sus și lăsăm exclusiv #main-area să se deruleze.
  if(activeTab!=='stock'||document.activeElement?.id!=='staff-stock-input')return;
  window.scrollTo(0,0);
  document.documentElement.scrollTop=0;
  document.body.scrollTop=0;
}
function startStockSwipe(ev){if(ev.target.closest('input,button'))return;stockSwipeX=ev.clientX;}
function endStockSwipe(ev){
  if(stockSwipeX===null)return;
  const dx=ev.clientX-stockSwipeX;stockSwipeX=null;
  if(Math.abs(dx)>=55)stockStep(dx<0?1:-1);
}
function parseStaffStock(raw){return Number(String(raw||'').trim().replace(/\s/g,'').replace(',','.'));}
async function saveStaffStock(){
  if(stockSaveBusy)return;
  const list=staffStockProducts(),p=list[stockCardIdx],inp=document.getElementById('staff-stock-input');
  const target=parseStaffStock(inp?.value);
  if(!p||!Number.isFinite(target)||target<0){showToast('Introdu un stoc fizic valid (0 sau mai mare)');return;}
  stockSaveBusy=true;let savedOk=false;renderMain();
  try{
    // Recitim produsul chiar înainte de scriere, astfel o vânzare sincronizată între timp nu este anulată.
    const rows=await sb('GET',`produse?id=eq.${p.id}&select=id,name,bought,sold,price_buy_ttc`),fresh=rows[0];
    if(!fresh)throw new Error('Produsul nu mai există în baza de date.');
    const before=Number(fresh.bought||0)-Number(fresh.sold||0),delta=target-before;
    if(delta!==0){
      const body=delta>0?{bought:Number(fresh.bought||0)+delta}:{sold:Number(fresh.sold||0)-delta};
      const saved=await sb('PATCH',`produse?id=eq.${p.id}`,body);
      Object.assign(p,saved[0]||body);
      const movement={tip:delta>0?'in':'out',product_id:p.id,product_name:fresh.name||p.name||'',qty:Math.abs(delta),sursa:'Raport stoc Staff'};
      await sb('POST','activitate_stoc',movement).catch(e=>console.warn('activitate_stoc:',e));
      await sb('POST','comenzi_stoc',{source:'Raport stoc Staff',total_items:1,total_qty:Math.abs(delta),total_value:Math.round(Math.abs(delta)*Number(fresh.price_buy_ttc||0)*100)/100,updated_count:1,created_count:0,skipped_count:0,details:[{status:'actualizat',productId:p.id,sku:p.sku||'',name:fresh.name||p.name||'',qty:delta,stockBefore:before,stockAfter:target,staff:staffName||''}]}).catch(e=>console.warn('comenzi_stoc:',e));
      logActivity('raport_stoc_actualizat',null,{productId:p.id,stockBefore:before,stockAfter:target,delta,staff:staffName||''});
      showToast(`✓ Stoc salvat: ${target} buc.`);
    }else showToast('Stocul fizic este deja corect.');
    savedOk=true;
  }catch(e){console.error(e);showToast('Eroare la salvarea stocului — încearcă din nou');}
  stockSaveBusy=false;
  if(savedOk&&stockCardIdx<list.length-1)stockCardIdx++;
  renderMain(true);
}
