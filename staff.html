<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Împachetare comenzi - AB HOMES</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📦</text></svg>">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500;600;700&display=swap');
:root{
  --bg:#F6F7FB;--surf:#FFFFFF;--surf2:#F8F9FC;
  --b1:#E5E7EB;--b2:#E5E7EB;--b3:#D0D5DD;
  --t1:#17181C;--t2:#3F4451;--t3:#667085;
  --acc:#7657F6;--acc2:#6342E8;--acc-fg:#FFFFFF;--acc-light:#F3F0FF;
  --gr:#12B76A;--gr-bg:#ECFDF3;
  --rd:#F04438;--rd-bg:#FEF3F2;
  --or:#F79009;--or-bg:#FFFAEB;
  --r:10px;--r2:14px;--r3:18px;
  --font:'DM Sans',sans-serif;--mono:'Roboto Mono',monospace;
  --sh2:0 8px 24px rgba(16,24,40,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--t1);font-size:22px;font-weight:500;line-height:1.4;min-height:100vh;-webkit-font-smoothing:antialiased;touch-action:manipulation;overscroll-behavior:none}
button{font-family:var(--font);cursor:pointer}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;min-height:100vh}
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hdr h1{font-size:26px;font-weight:700}
.hdr .progress{font-size:18px;color:var(--t3);font-weight:600}
.sync-dot{width:11px;height:11px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}
.sync-dot.ok{background:var(--gr)}
.sync-dot.err{background:var(--rd)}
.search-row{display:flex;gap:8px;margin-bottom:16px}
.search-row input{flex:1;font-size:20px;padding:14px 16px;border:1px solid var(--b2);border-radius:var(--r2);background:var(--surf)}
.search-row input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-light)}
.search-drop{position:relative}
.search-results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surf);border:1px solid var(--b2);border-radius:var(--r2);box-shadow:var(--sh2);max-height:320px;overflow-y:auto;z-index:20;display:none}
.search-results.on{display:block}
.search-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid var(--b1);font-size:18px}
.search-item:last-child{border-bottom:none}
.search-item:active{background:var(--surf2)}
.search-item b{color:var(--acc)}
.toggle-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:16px;color:var(--t2)}
.toggle-row input{width:20px;height:20px}
.empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--t3);text-align:center;padding:40px 20px}
.empty .big{font-size:60px}
.card{background:var(--surf);border:1px solid var(--b1);border-radius:var(--r3);box-shadow:var(--sh2);padding:22px;flex:1;display:flex;flex-direction:column;gap:16px}
.card.finalized{border-color:var(--gr);background:linear-gradient(180deg,var(--gr-bg),var(--surf) 120px)}
.ord-hdr{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--b1)}
.ord-pl{font-weight:700;padding:4px 12px;border-radius:999px;font-size:16px}
.ord-pl.emag{background:var(--acc-light);color:var(--acc)}
.ord-pl.trendyol{background:var(--or-bg);color:var(--or)}
.ord-pl.direct{background:var(--surf2);color:var(--t2)}
.ord-num{font-family:var(--mono);font-weight:700;font-size:20px}
.ord-client{color:var(--t2);font-size:18px}
.ord-date{color:var(--t3);font-size:16px;margin-left:auto}
.ord-finalized-badge{background:var(--gr-bg);color:var(--gr);font-weight:700;padding:4px 12px;border-radius:999px;font-size:15px}
.lines{display:flex;flex-direction:column;gap:16px}
.line{display:flex;gap:16px;padding:14px;border:1px solid var(--b1);border-radius:var(--r2);flex-wrap:wrap}
.line.done{border-color:var(--gr);background:var(--gr-bg)}
.line.oos{border-color:var(--rd);background:var(--rd-bg)}
.line-img-wrap{flex-shrink:0;width:130px}
.line-img{width:130px;height:130px;border-radius:var(--r);object-fit:cover;border:1px solid var(--b1);background:var(--surf2);cursor:pointer}
.line-img-ph{width:130px;height:130px;border-radius:var(--r);background:var(--surf2);border:1px dashed var(--b2);display:flex;align-items:center;justify-content:center;font-size:52px}
.line-thumbs{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.line-thumb{width:28px;height:28px;border-radius:5px;object-fit:cover;cursor:pointer;border:2px solid transparent;opacity:.6}
.line-thumb.active{border-color:var(--acc);opacity:1}
.line-info{flex:1;min-width:200px;display:flex;flex-direction:column;gap:4px}
.line-nm{font-weight:700;font-size:21px}
.line-meta{color:var(--t3);font-size:16px}
.line-qty{font-family:var(--mono);font-weight:800;font-size:24px;color:var(--acc)}
.line-actions{display:flex;gap:10px;width:100%;margin-top:6px}
.line-btn{flex:1;padding:16px 10px;border-radius:var(--r2);border:2px solid var(--b2);background:var(--surf);font-size:19px;font-weight:700;color:var(--t2);transition:all .15s;min-height:64px}
.line-btn.pack{color:var(--gr)}
.line-btn.pack.active{background:var(--gr);border-color:var(--gr);color:#fff}
.line-btn.oosbtn{color:var(--rd)}
.line-btn.oosbtn.active{background:var(--rd);border-color:var(--rd);color:#fff}
.nav-row{display:flex;gap:10px;margin-top:18px}
.nav-btn{flex:1;padding:20px;border-radius:var(--r2);border:1px solid var(--b2);background:var(--surf);font-size:20px;font-weight:700;color:var(--t1);min-height:72px}
.nav-btn:disabled{opacity:.4}
.nav-btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--t1);color:#fff;padding:14px 24px;border-radius:999px;font-size:18px;font-weight:600;box-shadow:var(--sh2);z-index:100;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media(max-width:600px){
  .line{flex-direction:column;align-items:center;text-align:center}
  .line-img-wrap{width:100%;display:flex;justify-content:center}
  .line-info{align-items:center}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <h1>📦 Împachetare comenzi</h1>
    <div class="progress" id="progress"><span class="sync-dot" id="sync-dot"></span><span id="progress-txt">Se încarcă…</span></div>
  </div>
  <div class="search-row search-drop">
    <input type="text" id="search" placeholder="Caută după nr. comandă, client sau produs…" oninput="onSearchInput()" onkeydown="if(event.key==='Enter')jumpToFirstResult()">
    <div class="search-results" id="search-results"></div>
  </div>
  <label class="toggle-row"><input type="checkbox" id="show-finalized" onchange="onToggleFinalized()"> Arată și comenzile finalizate</label>
  <div id="main-area"></div>
</div>
<div class="toast" id="toast"></div>
<script>
const SUPA_URL='https://nuvgwytanlgvcffxeahs.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im51dmd3eXRhbmxndmNmZnhlYWhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3MDI0OTAsImV4cCI6MjA5NTI3ODQ5MH0.lSy1CUJA9xlVv1isAyfTIxGUAbGMUIS7c3TXQ-5pcEg';
async function sb(method,path,body){
  const opts={method,headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Prefer':'return=representation'}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SUPA_URL+'/rest/v1/'+path,opts);
  const d=await r.json();
  if(!r.ok)throw new Error(JSON.stringify(d));
  return d;
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function imgSrc(url){if(!url)return'';if(url.startsWith('data:'))return url;if(url.startsWith(SUPA_URL))return url;if(url.startsWith('http'))return'/api/img-proxy?url='+encodeURIComponent(url);return url;}

// Doar comenzile/vânzările de la această dată încolo intră în coadă — comenzile mai vechi decât
// lansarea paginii de Staff rămân în istoric (index.html), dar nu mai apar aici (cerință directă:
// "de azi trebuie sa inceapa"). NU se recalculează automat la fiecare zi — e un prag fix.
const CUTOFF_DATE='2026-08-27';

let PRODUSE=[],COMENZI=[],JURNAL=[],ORDERS=[],curKey=null,showFinalized=false,activeImg={};

function findProdus(id){return id?PRODUSE.find(p=>p.id===id):null;}

function computeOrders(){
  const groups={};
  COMENZI.forEach(o=>{
    const key=o.comanda_id||('_row'+o.id);
    if(!groups[key])groups[key]={key,comandaId:o.comanda_id||'',platforma:o.platforma,clientNume:o.client_nume||'',data:o.data,sortAt:o.created_at||o.data,lines:[]};
    o._table='platforma_comenzi';
    groups[key].lines.push(o);
    if(String(o.created_at||o.data)<String(groups[key].sortAt))groups[key].sortAt=o.created_at||o.data;
  });

  // Comenzile eMAG/Trendyol se scriu automat și în Jurnal la import (ca să existe evidența zilnică
  // corectă acolo) — ca să nu apară de 2 ori în coadă, scădem din fiecare rând de Jurnal cantitatea
  // deja acoperită de o comandă de platformă pentru același produs, în aceeași zi. Ce rămâne peste
  // (dacă rămâne) chiar a fost o vânzare directă.
  const coveredByPlatform={};
  COMENZI.forEach(o=>{
    const day=String(o.created_at||o.data).slice(0,10);
    const k=o.produs_id+'|'+day;
    coveredByPlatform[k]=(coveredByPlatform[k]||0)+(Number(o.cantitate)||0);
  });
  JURNAL.forEach(j=>{
    const day=String(j.data).slice(0,10);
    const k=j.product_id+'|'+day;
    const remaining=(Number(j.qty)||0)-(coveredByPlatform[k]||0);
    if(remaining<=0)return;
    const line={id:j.id,produs_id:j.product_id,produs_nume:j.product_name,cantitate:remaining,pnk:'',impachetat:!!j.impachetat,fara_stoc:!!j.fara_stoc,_table:'jurnal'};
    groups['j'+j.id]={key:'j'+j.id,comandaId:'',platforma:'direct',clientNume:'',data:j.data,sortAt:j.created_at||j.data,lines:[line]};
  });

  ORDERS=Object.values(groups).sort((a,b)=>String(a.sortAt).localeCompare(String(b.sortAt))||a.key.localeCompare(b.key));
  ORDERS.forEach(g=>{g.finalized=g.lines.every(l=>l.impachetat||l.fara_stoc);});
}
function visibleOrders(){return showFinalized?ORDERS:ORDERS.filter(o=>!o.finalized);}
function currentOrder(){return ORDERS.find(o=>o.key===curKey)||null;}

function pickInitialOrder(){
  const vis=visibleOrders();
  curKey=vis.length?vis[0].key:(ORDERS[0]?ORDERS[0].key:null);
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t=setTimeout(()=>t.classList.remove('on'),1800);
}

function renderProgress(){
  const remaining=ORDERS.filter(o=>!o.finalized).length;
  document.getElementById('progress-txt').textContent=remaining?`${remaining} comenzi rămase de împachetat`:'Toate comenzile sunt împachetate ✓';
}

// id-urile din platforma_comenzi și din jurnal sunt secvențe separate — pot coincide (ex. ambele
// au un rând cu id=5) — orice căutare/cheie pe un rând de linie folosește tabelul+id, nu doar id.
function lineKey(l){return l._table+'_'+l.id;}
function findLineByKey(lk){return ORDERS.flatMap(o=>o.lines).find(l=>lineKey(l)===lk)||null;}

function lineImgList(l){
  const p=findProdus(l.produs_id);
  if(!p)return[];
  const list=[];
  if(p.img)list.push(p.img);
  (p.images||[]).forEach(u=>{if(u&&!list.includes(u))list.push(u);});
  return list;
}

function renderMain(){
  renderProgress();
  const host=document.getElementById('main-area');
  const vis=visibleOrders();
  const ord=currentOrder();
  if(!ord||(!showFinalized&&ord.finalized)){
    if(vis.length){curKey=vis[0].key;return renderMain();}
    host.innerHTML=`<div class="empty"><div class="big">🎉</div><div>Nicio comandă de împachetat momentan.</div></div>`;
    return;
  }
  const idxInVis=vis.findIndex(o=>o.key===ord.key);
  const plLabel=ord.platforma==='emag'?'eMAG':ord.platforma==='trendyol'?'Trendyol':'Vânzare directă';
  const linesHtml=ord.lines.map((l,li)=>{
    const lk=lineKey(l);
    const p=findProdus(l.produs_id);
    const imgs=lineImgList(l);
    const activeUrl=activeImg[lk]||imgs[0]||'';
    const imgHtml=activeUrl
      ?`<img class="line-img" src="${esc(imgSrc(activeUrl))}" onerror="this.style.display='none'" onclick="cycleLineImg('${lk}')">`
      :`<div class="line-img-ph">📦</div>`;
    const thumbsHtml=imgs.length>1?`<div class="line-thumbs">${imgs.map(u=>`<img class="line-thumb ${u===activeUrl?'active':''}" src="${esc(imgSrc(u))}" onclick="activeImg['${lk}']='${esc(u)}';renderMain()">`).join('')}</div>`:'';
    const state=l.impachetat?'done':(l.fara_stoc?'oos':'');
    return`<div class="line ${state}">
      <div class="line-img-wrap">${imgHtml}${thumbsHtml}</div>
      <div class="line-info">
        <div class="line-nm">${esc(l.produs_nume||l.titlu_extern||'Produs necunoscut')}</div>
        <div class="line-meta">${p&&p.sku?'SKU '+esc(p.sku)+' · ':''}${l.pnk?'PNK '+esc(l.pnk):''}</div>
        <div class="line-qty">${l.cantitate}×</div>
        <div class="line-actions">
          <button class="line-btn pack ${l.impachetat?'active':''}" onclick="markLine('${lk}','impachetat')">📦 Împachetat</button>
          <button class="line-btn oosbtn ${l.fara_stoc?'active':''}" onclick="markLine('${lk}','fara_stoc')">❌ Stoc zero</button>
        </div>
      </div>
    </div>`;
  }).join('');
  host.innerHTML=`<div class="card ${ord.finalized?'finalized':''}">
    <div class="ord-hdr">
      <span class="ord-pl ${ord.platforma}">${plLabel}</span>
      ${ord.comandaId?`<span class="ord-num">#${esc(ord.comandaId)}</span>`:''}
      ${ord.clientNume?`<span class="ord-client">👤 ${esc(ord.clientNume)}</span>`:''}
      <span class="ord-date">${esc(ord.data||'')}</span>
      ${ord.finalized?'<span class="ord-finalized-badge">✓ Finalizată</span>':''}
    </div>
    <div class="lines">${linesHtml}</div>
    <div class="nav-row">
      <button class="nav-btn" onclick="navStep(-1)" ${idxInVis<=0?'disabled':''}>◀ Înapoi</button>
      <button class="nav-btn primary" onclick="navStep(1)" ${idxInVis<0||idxInVis>=vis.length-1?'disabled':''}>Înainte ▶</button>
    </div>
  </div>`;
}

function cycleLineImg(lk){
  const imgs=lineImgList(findLineByKey(lk)||{});
  if(imgs.length<2)return;
  const cur=activeImg[lk]||imgs[0];
  const idx=(imgs.indexOf(cur)+1)%imgs.length;
  activeImg[lk]=imgs[idx];
  renderMain();
}

async function markLine(lk,field){
  const line=findLineByKey(lk);
  if(!line)return;
  const ord=ORDERS.find(o=>o.lines.includes(line));
  if(!ord)return;
  const other=field==='impachetat'?'fara_stoc':'impachetat';
  const newVal=!line[field];
  const body={[field]:newVal,[field+'_at']:newVal?new Date().toISOString():null};
  if(newVal&&line[other]){body[other]=false;body[other+'_at']=null;}
  try{
    await sb('PATCH',`${line._table}?id=eq.${line.id}`,body);
    Object.assign(line,body);
    const wasFinalized=ord.finalized;
    ord.finalized=ord.lines.every(l=>l.impachetat||l.fara_stoc);
    if(!wasFinalized&&ord.finalized){
      showToast('Comandă finalizată ✓');
      if(!showFinalized){
        setTimeout(()=>{advanceToNext(ord.key);renderMain();},400);
        return;
      }
    }
    renderMain();
  }catch(e){
    showToast('Eroare la salvare — încearcă din nou');
    console.error(e);
  }
}

function advanceToNext(fromKey){
  const vis=visibleOrders();
  if(!vis.length){curKey=ORDERS[0]?ORDERS[0].key:null;return;}
  const idx=ORDERS.findIndex(o=>o.key===fromKey);
  const next=vis.find(o=>ORDERS.findIndex(x=>x.key===o.key)>idx)||vis[0];
  curKey=next.key;
}

function navStep(dir){
  const vis=visibleOrders();
  const idx=vis.findIndex(o=>o.key===curKey);
  const newIdx=idx+dir;
  if(newIdx<0||newIdx>=vis.length)return;
  curKey=vis[newIdx].key;
  renderMain();
}

function onToggleFinalized(){
  showFinalized=document.getElementById('show-finalized').checked;
  if(!visibleOrders().some(o=>o.key===curKey))pickInitialOrder();
  renderMain();
}

function matchOrder(o,q){
  const s=q.toLowerCase();
  if((o.comandaId||'').toLowerCase().includes(s))return true;
  if((o.clientNume||'').toLowerCase().includes(s))return true;
  return o.lines.some(l=>(l.produs_nume||l.titlu_extern||'').toLowerCase().includes(s));
}
function onSearchInput(){
  const q=document.getElementById('search').value.trim();
  const box=document.getElementById('search-results');
  if(!q){box.classList.remove('on');box.innerHTML='';return;}
  const hits=ORDERS.filter(o=>matchOrder(o,q)).slice(0,12);
  if(!hits.length){box.innerHTML=`<div class="search-item" style="color:var(--t3)">Nicio comandă găsită</div>`;box.classList.add('on');return;}
  box.innerHTML=hits.map(o=>{
    const nm=o.lines.map(l=>l.produs_nume||l.titlu_extern).filter(Boolean).join(', ');
    return`<div class="search-item" onclick="jumpToOrder('${o.key}')"><b>#${esc(o.comandaId||'—')}</b> ${o.clientNume?'· 👤 '+esc(o.clientNume)+' ':''}${o.finalized?'· ✓ ':''}<br>${esc(nm)}</div>`;
  }).join('');
  box.classList.add('on');
}
function jumpToOrder(key){
  curKey=key;
  document.getElementById('search').value='';
  document.getElementById('search-results').classList.remove('on');
  renderMain();
  window.scrollTo({top:0,behavior:'smooth'});
}
function jumpToFirstResult(){
  const q=document.getElementById('search').value.trim();
  if(!q)return;
  const hit=ORDERS.find(o=>matchOrder(o,q));
  if(hit)jumpToOrder(hit.key);
}
document.addEventListener('click',ev=>{
  if(!ev.target.closest('.search-drop'))document.getElementById('search-results').classList.remove('on');
});

async function load(){
  try{
    const [prodRows,comRows]=await Promise.all([
      sb('GET','produse?select=id,name,sku,img,images&order=id.asc'),
      sb('GET',`platforma_comenzi?select=*&created_at=gte.${CUTOFF_DATE}&order=created_at.asc`),
    ]);
    PRODUSE=prodRows;
    COMENZI=comRows;
    try{
      JURNAL=await sb('GET',`jurnal?select=*&data=gte.${CUTOFF_DATE}&order=data.asc`);
    }catch(e){
      JURNAL=[];
      console.warn('Nu am putut încărca vânzările directe din Jurnal (rulează migration_jurnal_packing.sql):',e);
    }
    document.getElementById('sync-dot').className='sync-dot ok';
    computeOrders();
    pickInitialOrder();
    renderMain();
  }catch(e){
    document.getElementById('sync-dot').className='sync-dot err';
    document.getElementById('progress-txt').textContent='Eroare de conexiune';
    document.getElementById('main-area').innerHTML=`<div class="empty"><div class="big">⚠️</div><div>Nu m-am putut conecta la baza de date.<br>Reîncarcă pagina.</div></div>`;
    console.error(e);
  }
}
load();
</script>
</body>
</html>
